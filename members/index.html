<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonight's Picks · Morello Sims</title>
<meta name="description" content="Members: tonight's NBA picks the moment the sim logs them.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/brand/v2/mark.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/brand/v2/note.css?v=20261020b">
<link rel="stylesheet" href="/assets/brand/v2/brand.css?v=20261020">
<link rel="stylesheet" href="/morello-auth.css?v=20261020-members">
<style>
:root{--sky:#10233F;--paper:#F5F0ED;--paper-2:#FBF8F5;--ink:#14202E;--ink-2:#4B5868;--ink-3:#8A93A0;--rule:#DED5CA;--green:#1FA255;--gold:#B9861B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
a{color:inherit}
button{font:inherit;cursor:pointer}
#ma-profile-btn,.ma-site-nav{display:none!important}
.sky{background:var(--sky);color:#fff;padding:0 16px 34px}
.bar{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{font-family:"Instrument Serif",Georgia,serif;font-size:27px;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:16px;font-style:italic;font-weight:300;font-size:14px}
.nav a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.55)}
.nav a.on{border-color:#fff;font-weight:400}
.head{max-width:760px;margin:18px auto 0}
.head h1{font-weight:300;font-size:clamp(40px,10vw,72px);letter-spacing:-1.5px;line-height:.95}
.head p{font-style:italic;font-weight:300;font-size:15px;margin-top:10px;opacity:.95}
.wrap{max-width:760px;margin:-18px auto 0;padding:0 16px 80px}
.card{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:22px;margin-bottom:14px}
.label{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3)}
.pick .side{font-size:clamp(30px,8vw,44px);font-weight:600;letter-spacing:-.5px;margin:8px 0 4px}
.pick .game{font-size:16px;color:var(--ink-2)}
.pick dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
.pick dt{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3)}
.pick dd{font-size:16px;font-weight:500;margin-top:4px}
.pick .sim{margin-top:14px;font-size:14px;color:var(--ink-2)}
.pick .logged{margin-top:6px;font-size:12px;color:var(--ink-3)}
.day{margin:26px 0 10px}
.msg h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:32px;line-height:1.1}
.msg p{color:var(--ink-2);margin-top:10px;line-height:1.55}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:3px;padding:12px 18px;font-weight:600;font-size:15px;text-decoration:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.foot{margin-top:24px;font-size:12px;color:var(--ink-3);line-height:1.6}
.foot a{color:var(--ink-2)}

/* brand v2 */
html,body{font-family:var(--ms-font)!important}
.sky{background:var(--ms-navy)!important}
.brand{line-height:0}.brand img{height:40px!important;width:auto!important}
.head h1{font-family:var(--ms-font)!important;font-weight:900!important;letter-spacing:-.02em!important}
.nav{font-style:normal!important;font-weight:600!important}
.nav a.on{border-color:var(--ms-mint)!important}
.subnav{display:none!important}
.title h2,.msg h2,.big .u,.u{font-family:var(--ms-font)!important}
.title h2{font-weight:800!important;letter-spacing:-.02em!important}
.big .u,.u{font-weight:900!important;letter-spacing:-.03em!important}
.stats b{font-weight:800!important}
.msg h2{font-weight:900!important;letter-spacing:-.015em!important}
.g .teams{font-weight:600!important}
@media(max-width:520px){.brand img{height:34px!important}.nav{gap:12px!important;font-size:13px!important}}
/* green field, white cards, like the dashboard */
html,body{background:#1FA255!important}
.label.day{color:rgba(255,255,255,.88)!important}
.foot,.foot a{color:rgba(255,255,255,.85)!important}
.card{border:0!important;box-shadow:0 14px 34px rgba(0,0,0,.14)}
/* tonight's picks as notes (assets/brand/v2/note.css): one per pick, its tier its own design */
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.notes .note-fit{border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
.notes .note-fit>.mn{border-radius:44px}
@media(max-width:620px){.notes{grid-template-columns:1fr}}
</style></head>
<body>

<header class="sky">
  <div class="bar"><a class="brand" href="/" aria-label="Morello Sims"><img src="/assets/brand/v2/lockup-on-dark.svg" alt="Morello Sims"></a>
    <nav class="nav"><a href="/">Picks</a><a href="/ledger/nba/">Ledger</a><a href="/members/dashboard/">Dashboard</a><a class="on" href="/members/">Members</a></nav></div>
  <div class="head"><h1>Tonight's picks</h1><p id="sub">Members only. Every pick the moment the sim logs it.</p></div>
</header>

<main class="wrap" id="main"><div class="card msg"><p>Loading…</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="/morello-auth.js?v=20261020-members"></script>
<script>
const $ = id => document.getElementById(id);
const main = $("main");
const PAID = /[?&]paid=1/.test(location.search);
const etDate = (d = new Date()) => new Intl.DateTimeFormat("en-CA", {timeZone: "America/New_York"}).format(d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const foot = `<p class="foot">Every pick is graded in public on the <a href="/ledger/nba/">ledger</a>.
  Simulations, not guarantees. 21+ · 1-800-GAMBLER.</p>`;
let unsub = null;

function msg(title, body, buttons = "") {
  main.innerHTML = `<div class="card msg"><h2>${title}</h2><p>${body}</p>${buttons ? `<div class="btns">${buttons}</div>` : ""}</div>${foot}`;
}

// mirror of hasActiveAccess in functions/index.js (Firestore rules enforce the same)
function passActive(u) {
  if (!u) return false;
  if (u.tier === "admin") return true;
  const exp = u.accessExpiresAt && u.accessExpiresAt.toMillis ? u.accessExpiresAt.toMillis() : 0;
  if (exp > Date.now()) return true;
  return u.checkoutMode === "subscription" && !!u.tier && u.tier !== "free";
}

// whitelisted accounts (friends & family): the Firestore rule is the source
// of truth, so ask it with a one-doc read instead of copying the list here
const rulesAllow = () => firebase.firestore().collection("member_picks").limit(1).get().then(() => true, () => false);

function passLine(u) {
  if (!u || u.tier === "fnf") return "You're on the friends & family list.";
  const exp = u.accessExpiresAt && u.accessExpiresAt.toMillis ? u.accessExpiresAt.toMillis() : 0;
  if (!exp) return "Your pass is active.";
  const t = new Date(exp).toLocaleString("en-US", {timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
  return `Your pass runs until ${t} ET.`;
}

// the note's teams: city, nickname, colours, ESPN logo code, arena (data/reference/nba_teams_espn_2026.json)
const TEAMS = {"ATL":["Atlanta","Hawks","#c8102e","#fdb927","atl","State Farm Arena"],"BOS":["Boston","Celtics","#008348","#ffffff","bos","TD Garden"],"BKN":["Brooklyn","Nets","#000000","#ffffff","bkn","Barclays Center"],"CHA":["Charlotte","Hornets","#008ca8","#1d1060","cha","Spectrum Center"],"CHI":["Chicago","Bulls","#ce1141","#000000","chi","United Center"],"CLE":["Cleveland","Cavaliers","#860038","#bc945c","cle","Rocket Arena"],"DAL":["Dallas","Mavericks","#0064b1","#bbc4ca","dal","American Airlines Center"],"DEN":["Denver","Nuggets","#0e2240","#fec524","den","Ball Arena"],"DET":["Detroit","Pistons","#1d428a","#c8102e","det","Little Caesars Arena"],"GSW":["Golden State","Warriors","#fdb927","#1d428a","gs","Chase Center"],"HOU":["Houston","Rockets","#ce0e2d","#000000","hou","Toyota Center"],"IND":["Indiana","Pacers","#0c2340","#ffd520","ind","Gainbridge Fieldhouse"],"LAC":["LA","Clippers","#12173f","#c8102e","lac","Intuit Dome"],"LAL":["Los Angeles","Lakers","#552583","#fdb927","lal","Crypto.com Arena"],"MEM":["Memphis","Grizzlies","#5d76a9","#12173f","mem","FedExForum"],"MIA":["Miami","Heat","#98002e","#000000","mia","Kaseya Center"],"MIL":["Milwaukee","Bucks","#00471b","#eee1c6","mil","Fiserv Forum"],"MIN":["Minnesota","Timberwolves","#266092","#79bc43","min","Target Center"],"NOP":["New Orleans","Pelicans","#0a2240","#b4975a","no","Smoothie King Center"],"NYK":["New York","Knicks","#1d428a","#f58426","ny","Madison Square Garden"],"OKC":["Oklahoma City","Thunder","#007ac1","#ef3b24","okc","Paycom Center"],"ORL":["Orlando","Magic","#0150b5","#9ca0a3","orl","Kia Center"],"PHI":["Philadelphia","76ers","#1d428a","#e01234","phi","Xfinity Mobile Arena"],"PHX":["Phoenix","Suns","#29127a","#e56020","phx","Mortgage Matchup Center"],"POR":["Portland","Trail Blazers","#e03a3e","#000000","por","Moda Center"],"SAC":["Sacramento","Kings","#5a2d81","#6a7a82","sac","Golden 1 Center"],"SAS":["San Antonio","Spurs","#000000","#c4ced4","sa","Frost Bank Center"],"TOR":["Toronto","Raptors","#d91244","#000000","tor","Scotiabank Arena"],"UTA":["Utah","Jazz","#4e008e","#79a3dc","utah","Delta Center"],"WAS":["Washington","Wizards","#e31837","#002b5c","wsh","Capital One Arena"]};
const STAKE = {0.25: "¼U", 0.5: "½U"};
const num = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
const etTime = d => d.toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});

function note(p, i) {
  const [abbr, lineRaw] = String(p.pick_text || "").split(" ");
  const [away, home] = [p.away, p.home].every(Boolean) ? [p.away, p.home] : String(p.matchup || "").split(" @ ");
  const T = TEAMS[abbr], book = parseFloat(String(lineRaw).replace("−", "-"));
  if ((p.bet_type || "spread") !== "spread" || !T || isNaN(book)) return null;
  const opp = abbr === home ? away : home, O = TEAMS[opp] || [opp, opp];
  let sim = parseFloat(String(String(p.sim_projection || "").split(" ")[1] || "").replace("−", "-"));
  // a logged pick always has the sim on its side of the book; records written before the
  // away-side sign fix in sync_to_picks_json carry the sim line flipped
  if (!isNaN(sim) && sim > book) sim = -sim;
  const edge = isNaN(sim) ? null : Math.abs(book - sim);
  const simTxt = isNaN(sim) ? "—" : sim < 0 ? `${T[1]} by ${+Math.abs(sim).toFixed(1)}` : sim === 0 ? "Pick'em" : `${T[1]} +${sim}`;
  const u = Number(p.units) || 0, stake = STAKE[u] || `${+u.toFixed(2)}U`;
  const start = p.start ? new Date(p.start) : null;
  const logged = p.logged_at && p.logged_at.toDate ? p.logged_at.toDate() : p.captured_at ? new Date(p.captured_at) : null;
  const tier = Math.max(6, Math.min(10, Number(p.conf) || 6));
  const odds = String(p.odds || "").replace("-", "−");
  const label = `${p.pick_text} ${p.odds}, C${tier}, ${stake} stake. Sim: ${simTxt}.`;
  return `<div class="note-fit" role="img" aria-label="${esc(label)}">
  <div class="mn" aria-hidden="true" data-tier="${tier}" style="--tc:${T[2]};--tc2:${T[3]}">
    <div class="mn-iris"></div><div class="mn-lat"></div><div class="mn-ros"></div><div class="mn-vig"></div><div class="mn-foil"></div><div class="mn-patch"><i></i></div>
    <div class="mn-win"><div><img src="https://a.espncdn.com/i/teamlogos/nba/500/${T[4]}.png" alt=""></div></div>
    <div class="mn-issuer"><i></i>Morello Sims</div>
    <div class="mn-city">${esc(T[0])}</div><div class="mn-nick">${esc(T[1])}</div>
    <div class="mn-den"><b>C${tier}</b><small>GRADE</small></div>
    <div class="mn-micro">MORELLO SIMS · EVERY PICK GRADED IN PUBLIC · LOGGED BEFORE TIP · MORELLO SIMS · EVERY PICK GRADED IN PUBLIC · LOGGED BEFORE TIP · MORELLO SIMS</div>
    <div class="mn-big" data-t="${esc(abbr)}">${esc(abbr)}</div>
    <div class="mn-pick"><span class="mn-k">The pick · NBA spread</span><div class="mn-line">${num(book)}</div><div class="mn-terms">${esc(odds)}&nbsp;· ${+u.toFixed(2)}&nbsp;unit${u === 1 ? "" : "s"}&nbsp;· ${abbr === home ? "vs" : "at"}&nbsp;${esc(O[1])}</div></div>
    <div class="mn-ser"><span style="font-size:20px">MS</span> <span style="font-size:22px">${esc(String(p.date || "").slice(2, 4) + String(p.date || "").slice(5, 7))}</span> <span style="font-size:25px">${esc(String(p.date || "").slice(8, 10))}</span><span style="font-size:28px">${String(i + 1).padStart(2, "0")}</span> <span style="font-size:31px">A</span></div>
    <div class="mn-ros2"><i></i><div><b>${stake}</b><small>STAKE</small></div></div>
    <div class="mn-data">
      <div class="mn-row"><div><span class="mn-k">Book</span><b>${esc(abbr)} ${num(book)}</b></div><div><span class="mn-k">Sim</span><b>${esc(simTxt)}</b></div><div class="e"><span class="mn-k">Edge</span><b>${edge === null ? "—" : edge.toFixed(1) + " pts"}</b></div><div><span class="mn-k">Tip</span><b>${start ? etTime(start) : esc(p.game_time || "Tonight")}</b></div></div>
      <div class="mn-fin"><span>${esc((TEAMS[away] || [, away])[1])} at ${esc((TEAMS[home] || [, home])[1])}${TEAMS[home] && TEAMS[home][5] ? " · " + esc(TEAMS[home][5]) : ""}</span><span class="mn-log">${logged ? "Logged " + etTime(logged) + " ET" : ""}</span></div>
    </div>
  </div></div>`;
}

// the notes are drawn at 1080 wide; scale each to its box, and shrink long nicknames to the room
function fitNotes() {
  document.querySelectorAll(".note-fit").forEach(f => {
    const go = () => { if (f.clientWidth) f.style.setProperty("--s", f.clientWidth / 1080); };
    go(); if (window.ResizeObserver) new ResizeObserver(go).observe(f);
    noteFonts.then(() => shrinkNote(f));
  });
}
// measured in the note's own fonts (a fallback face runs wider and would shrink every line)
const noteFonts = document.fonts ? Promise.all([document.fonts.load('condensed 900 100px "Archivo"'), document.fonts.load('600 25px "IBM Plex Mono"')]).catch(() => {}) : Promise.resolve();
function shrinkNote(f) {
  const n = f.querySelector(".mn-nick"); let fs = 158;            // long nicknames shrink to the room before the foil strip
  while (n && n.scrollWidth > 540 && fs > 90) { fs -= 4; n.style.fontSize = fs + "px"; }
  const l = f.querySelector(".mn-line"); let ls = 330;           // a double-digit line clears the stake rosette
  if (l) l.style.width = "max-content";
  while (l && l.offsetWidth > 600 && ls > 200) { ls -= 10; l.style.fontSize = ls + "px"; }
}

function notes(list) {
  const made = list.map(note), cards = list.filter((p, i) => !made[i]).map(card);
  return (made.some(Boolean) ? `<div class="notes">${made.filter(Boolean).join("")}</div>` : "") + cards.join("");
}

function card(p) {
  const logged = p.logged_at && p.logged_at.toDate ? p.logged_at.toDate().toLocaleTimeString("en-US", {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"}) + " ET" : "";
  return `<article class="card pick">
    <div class="label">${esc((p.sport || "nba").toUpperCase())} · ${esc(p.bet_type || "pick")}</div>
    <div class="side">${esc(p.pick_text)} ${esc(p.odds)}</div>
    <div class="game">${esc(p.matchup)}${p.game_time ? " · " + esc(p.game_time) : ""}</div>
    <dl><div><dt>Stake</dt><dd>${esc(p.units)}u</dd></div><div><dt>Confidence</dt><dd>${esc(p.conf)}/10</dd></div><div><dt>Odds</dt><dd>${esc(p.odds)}</dd></div></dl>
    ${p.sim_projection ? `<p class="sim">The sim: ${esc(p.sim_projection)}</p>` : ""}
    ${logged ? `<p class="logged">Logged ${logged}</p>` : ""}
  </article>`;
}

function showPicks(user, u) {
  const today = etDate(), yday = etDate(new Date(Date.now() - 864e5));
  $("sub").textContent = passLine(u) + " New picks appear here and in your inbox.";
  if (unsub) unsub();
  unsub = firebase.firestore().collection("member_picks").where("date", ">=", yday).onSnapshot(snap => {
    const picks = snap.docs.map(d => d.data()).sort((a, b) => (b.date || "").localeCompare(a.date || "")
      || ((b.logged_at?.toMillis?.() || 0) - (a.logged_at?.toMillis?.() || 0)));
    const tonight = picks.filter(p => p.date === today), earlier = picks.filter(p => p.date !== today);
    let html = `<div class="label day">Tonight · ${new Date().toLocaleDateString("en-US", {timeZone: "America/New_York", weekday: "long", month: "short", day: "numeric"})}</div>`;
    html += tonight.length ? notes(tonight) : `<div class="card msg"><h2>No pick yet tonight.</h2>
      <p>The sim logs a pick when it finds an edge against the line, usually by early afternoon ET. It shows up here
      the second it's logged, and we email you. Some nights the sim passes.</p></div>`;
    html += `<div class="card msg"><div class="label">Members dashboard</div><h2 style="margin-top:8px">Every game, the court sim, player MOJO and trends.</h2>
      <div class="btns"><a class="btn" href="/members/dashboard/">Open the dashboard</a></div></div>`;
    if (earlier.length) html += `<div class="label day">Last night</div>` + notes(earlier);
    main.innerHTML = html + foot;
    fitNotes();
  }, err => {
    msg("Your picks didn't load.", `Your account shows a pass, but the members list wouldn't open (${esc(err.code || "error")}).
      Sign out and back in; if it persists, reply to any pick email and we'll fix it.`,
      `<button class="btn ghost" onclick="morelloAuth.handleSignout()">Sign out</button>`);
  });
}

async function readUser(uid) {
  const snap = await firebase.firestore().collection("users").doc(uid).get();
  return snap.exists ? snap.data() : null;
}

async function onUser(user) {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    return msg("Sign in to see tonight's picks.", "Members see every pick the moment the sim logs it, and get it by email.",
      `<button class="btn" onclick="morelloAuth.openModal('signin')">Sign in</button><a class="btn ghost" href="/#plans">Get a pass</a>`);
  }
  let u = await readUser(user.uid).catch(() => null);
  // back from Stripe: the webhook can take a few seconds to record the pass
  for (let i = 0; PAID && !passActive(u) && i < 40; i++) {
    msg("Confirming your payment…", "This takes a few seconds. Don't buy again; your pass is on its way.");
    await new Promise(r => setTimeout(r, 3000));
    u = await readUser(user.uid).catch(() => u);
  }
  if (PAID) { try { history.replaceState(null, "", location.pathname); } catch (_) {} }
  if (passActive(u) || await rulesAllow()) return showPicks(user, u);
  if (PAID) {
    return msg("Your payment is still confirming.", "Stripe hasn't confirmed it yet. Refresh in a minute. Please don't buy again.",
      `<button class="btn" onclick="location.reload()">Refresh</button>`);
  }
  msg("No active pass on this account.", `Signed in as ${esc(user.email)}. A pass unlocks every pick tonight, here and in your inbox.`,
    `<a class="btn" href="/#plans">Get tonight's picks</a><button class="btn ghost" onclick="morelloAuth.handleSignout()">Sign out</button>`);
}

(function wait(n) {
  if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length) return firebase.auth().onAuthStateChanged(onUser);
  if (n > 100) return msg("The page didn't load.", "Refresh to try again.");
  setTimeout(() => wait(n + 1), 100);
})(0);
</script>
</body></html>
