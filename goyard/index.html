<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO-YARD | MorelloSims Home Run Lotto</title>
<meta name="description" content="GO-YARD — the Morello Sims daily home run board, ranked by matchup lift.">
<meta property="og:title" content="GO-YARD — Daily Home Run Board · Morello Sims">
<meta property="og:description" content="The daily home run board, ranked by matchup lift.">
<meta property="og:url" content="https://morellosims.com/goyard/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://morellosims.com/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#9E9E9E; --black:#080808; --card:#FFFFFF; --accent:#FFEA00;
    --meta:#4A4A4A; --red:#FF3333; --green:#00A334;
    --font-display:'Anton',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--black); font-family:var(--font-body);
    background-image:radial-gradient(#8a8a8a 1px, transparent 1px);
    background-size:26px 26px; min-height:100vh;
  }
  a{color:inherit}

  /* ── header ── */
  header{
    display:flex; align-items:center; gap:14px; padding:14px 22px;
    background:var(--black); border-bottom:3px solid var(--black);
  }
  .wordmark{
    font-family:var(--font-display); font-size:30px; letter-spacing:1px; color:var(--accent);
    background:var(--black); line-height:1; padding-top:2px;
  }
  .wordmark span{color:#fff}
  .sub{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:#bbb; margin-top:3px}
  header .right{margin-left:auto; display:flex; gap:10px}
  .btn{
    font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:.06em;
    text-decoration:none; padding:8px 14px; border:2px solid var(--accent);
    color:var(--black); background:var(--accent); box-shadow:3px 3px 0 #555;
  }
  .btn.ghost{background:transparent; color:#fff; border-color:#fff}

  .wrap{max-width:1160px; margin:0 auto; padding:26px 18px 70px}

  /* ── hero strip ── */
  .hero{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px}
  h1{font-family:var(--font-display); font-size:clamp(40px,7vw,72px); line-height:.95; letter-spacing:1px; margin-bottom:10px}
  h1 .yard{color:#fff; text-shadow:3px 3px 0 var(--black)}
  .tagline{font-family:var(--font-mono); font-size:12px; color:#333; max-width:44ch; line-height:1.5}
  .datechip{
    font-family:var(--font-mono); font-size:12px; font-weight:700; background:var(--black); color:var(--accent);
    padding:6px 12px; box-shadow:3px 3px 0 #555; white-space:nowrap;
  }

  /* ── launch map ── */
  .field-box{
    background:var(--card); border:3px solid var(--black); box-shadow:8px 8px 0 var(--black);
    margin-bottom:34px; overflow:hidden; position:relative;
  }
  .field-head{
    display:flex; align-items:center; gap:10px; padding:10px 16px;
    border-bottom:3px solid var(--black); background:var(--accent);
  }
  .field-head .t{font-family:var(--font-display); font-size:20px; letter-spacing:1px}
  .field-head .s{font-family:var(--font-mono); font-size:10px; color:#333; margin-left:auto; text-align:right}
  #field{display:block; width:100%; height:auto; background:#f4f2ec}
  .replay{
    position:absolute; right:12px; bottom:12px; font-family:var(--font-mono); font-size:11px; font-weight:700;
    background:var(--black); color:var(--accent); border:0; padding:7px 12px; cursor:pointer; box-shadow:3px 3px 0 rgba(0,0,0,.35);
  }

  /* ── cards ── */
  .rowhead{display:flex; align-items:baseline; gap:12px; margin:0 0 12px}
  .rowhead h2{font-family:var(--font-display); font-size:26px; letter-spacing:1px}
  .rowhead .s{font-family:var(--font-mono); font-size:11px; color:#333}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:20px; margin-bottom:40px}

  .pick{
    background:var(--card); border:3px solid var(--black); box-shadow:6px 6px 0 var(--black);
    position:relative; transition:transform .12s, box-shadow .12s; cursor:pointer;
  }
  .pick:hover{transform:translate(-2px,-2px); box-shadow:9px 9px 0 var(--black)}
  .pick.flash{animation:flash .5s}
  @keyframes flash{0%{background:var(--accent)}100%{background:var(--card)}}
  .pick .top{border-bottom:3px solid var(--black); padding:12px 14px 10px; display:flex; gap:10px; align-items:flex-start; border-top:8px solid var(--tc,#333)}
  .pick .rank{
    font-family:var(--font-display); font-size:26px; width:40px; height:40px; flex:0 0 40px;
    display:flex; align-items:center; justify-content:center;
    background:var(--black); color:var(--accent);
  }
  .pick .who{min-width:0}
  .pick .nm{font-family:var(--font-display); font-size:24px; letter-spacing:.5px; line-height:1.02; text-transform:uppercase}
  .pick .vs{font-family:var(--font-mono); font-size:11px; color:var(--meta); margin-top:3px}
  .pick .lift{
    margin-left:auto; text-align:center; background:var(--accent); border:3px solid var(--black);
    padding:4px 10px 2px; box-shadow:3px 3px 0 var(--black); transform:rotate(3deg); flex:0 0 auto;
  }
  .pick .lift .x{font-family:var(--font-display); font-size:28px; line-height:1}
  .pick .lift .l{font-family:var(--font-mono); font-size:8px; font-weight:700; letter-spacing:.1em}
  .pick .body{padding:12px 14px 14px}
  .plain{font-size:13px; line-height:1.45; margin-bottom:12px}
  .plain b{font-weight:800}

  .meter{margin-bottom:10px}
  .meter .lab{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.06em; margin-bottom:3px}
  .meter .bar{height:14px; border:2px solid var(--black); background:#eee; position:relative}
  .meter .fill{position:absolute; inset:0; width:0; background:var(--tc,#333); transition:width .8s cubic-bezier(.2,.9,.3,1)}
  .meter .usual{position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--black)}
  .meter.today .fill{background:var(--accent); border-right:2px solid var(--black)}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
  .chip{font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:.05em; border:2px solid var(--black); padding:3px 8px; background:#fff}
  .chip.lane{color:#fff; border-color:var(--black)}
  .chip.hot{background:var(--accent)}

  .foot{font-family:var(--font-mono); font-size:10px; color:#333; border-top:2px dashed #999; margin-top:12px; padding-top:8px; display:flex; justify-content:space-between}

  /* watch list */
  .watch .pick .nm{font-size:19px}
  .watch .pick .rank{background:#555}

  .disclaimer{font-family:var(--font-mono); font-size:10px; color:#444; text-align:center; margin-top:10px; line-height:1.6}
  .empty{
    background:var(--card); border:3px solid var(--black); box-shadow:6px 6px 0 var(--black);
    padding:38px 20px; text-align:center; font-family:var(--font-mono); font-size:13px;
  }
  @media (max-width:640px){
    header{padding:12px 14px} .wordmark{font-size:24px}
    .wrap{padding:18px 12px 50px}
    .grid{grid-template-columns:1fr; gap:14px}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="wordmark">GO-<span>YARD</span></div>
    <div class="sub">MORELLO SIMS · HOME RUN LOTTO</div>
  </div>
  <div class="right">
    <a class="btn ghost" href="../mlbsim/">FULL BOARD →</a>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>TODAY'S <span class="yard">LAUNCH BOARD</span></h1>
      <div class="tagline">The daily home run board, ranked by matchup lift over each hitter's usual rate.</div>
    </div>
    <div class="datechip" id="tdate">—</div>
  </div>

  <div class="field-box">
    <div class="field-head">
      <span class="t">LAUNCH MAP</span>
      <span class="s">deeper into the seats = bigger lift</span>
    </div>
    <svg id="field" viewBox="0 0 1000 560" role="img" aria-label="Launch map: each ball is one pick, distance shows model boost"></svg>
    <button class="replay" id="replay">↻ RE-LAUNCH</button>
  </div>

  <div class="rowhead"><h2>CORE PICKS</h2></div>
  <div class="grid" id="core"></div>

  <div id="watchwrap" class="watch" style="display:none">
    <div class="rowhead"><h2>WATCH LIST</h2></div>
    <div class="grid" id="watch"></div>
  </div>

  <div class="disclaimer">MODEL OUTPUT, NOT BETTING ADVICE · MORELLOSIMS@GMAIL.COM</div>
</div>

<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:50"></canvas>

<script>
const TEAM_COLORS = {ARI:'#A71930',AZ:'#A71930',ATL:'#CE1141',BAL:'#DF4601',BOS:'#BD3039',CHC:'#0E3386',CIN:'#C6011F',CLE:'#00385D',COL:'#333366',CWS:'#27251F',DET:'#0C2340',HOU:'#002D62',KC:'#004687',LAA:'#BA0021',LAD:'#005A9C',MIA:'#00A3E0',MIL:'#0C2C56',MIN:'#002B5C',NYM:'#002D72',NYY:'#092C5C',OAK:'#003831',ATH:'#003831',PHI:'#E81828',PIT:'#27251F',SD:'#2F241D',SEA:'#0C2C56',SF:'#FD5A1E',STL:'#C41E3A',TB:'#092C5C',TEX:'#003278',TOR:'#134A8E',WSH:'#AB0003',WAS:'#AB0003'};
const LANE_COLORS = {DAMAGE:'#a82020', SURGE:'#b06a08', PRESSURE:'#1e549e', FORM:'#1e7a3c', H2H:'#5c2d91', STACK:'#8a6d00'};
const $ = s => document.querySelector(s);

function liftOf(p){
  if (p.hr_rate && p.base_hr_rate) return p.hr_rate / Math.max(p.base_hr_rate, .001);
  return 1;
}
function fmtPct(x){ return (100*(x||0)).toFixed(1) + '%'; }

// ── cards ──
function heatChip(p){
  const s = p.streak||0, h5 = p.hit_games_5||0, g5 = p.games_5||0;
  if (s >= 5) return {t:`🔥 ${s}-GAME HIT STREAK`, hot:true};
  if (s >= 3) return {t:`${s}-GAME HIT STREAK`, hot:true};
  if (g5 >= 5 && h5 >= 4) return {t:`HITS IN ${h5} OF LAST 5`, hot:true};
  return null;
}

function card(p, i, isCore){
  const lift = liftOf(p);
  const tc = TEAM_COLORS[p.team] || '#333';
  const laneU = (p.lane||'').toUpperCase();
  const laneC = LANE_COLORS[laneU] || '#333';
  const el = document.createElement('div');
  el.className = 'pick';
  el.style.setProperty('--tc', tc);
  const todayW = Math.min(100, (p.hr_rate||0)/0.20*100);
  const usualX = Math.min(97, (p.base_hr_rate||0)/0.20*100);
  const heat = heatChip(p);
  const parkNote = p.park_factor && p.park_factor >= 1.04 ? `<span class="chip">PARK +${Math.round((p.park_factor-1)*100)}%</span>` :
                   p.park_factor && p.park_factor <= 0.96 ? `<span class="chip">PARK ${Math.round((p.park_factor-1)*100)}%</span>` : '';
  const h2h = (p.h2h_pa||0) >= 6 && (p.h2h_hr||0) > 0 ? `<span class="chip">${p.h2h_hr} HR OFF HIM (${p.h2h_pa} PA)</span>` : '';
  el.innerHTML = `
    <div class="top">
      <div class="rank">${isCore ? (i+1) : '·'}</div>
      <div class="who">
        <div class="nm">${p.name||'—'}</div>
        <div class="vs">${p.team||''} · bats #${p.order||'?'} · vs ${p.opp_pitcher||'?'} (${p.opp_team||''})</div>
      </div>
      <div class="lift"><div class="x">${lift.toFixed(1)}×</div><div class="l">VS USUAL</div></div>
    </div>
    <div class="body">
      <div class="meter today">
        <div class="lab"><span>TONIGHT'S HR CHANCE / AB</span><span>${fmtPct(p.hr_rate)}</span></div>
        <div class="bar"><div class="fill" data-w="${todayW}"></div><div class="usual" style="left:${usualX}%"></div></div>
        <div class="lab" style="margin-top:2px"><span></span><span style="color:#666">▲ his usual: ${fmtPct(p.base_hr_rate)}</span></div>
      </div>
      <div class="chips">
        <span class="chip lane" style="background:${laneC}">${laneU||'—'} LANE</span>
        ${heat ? `<span class="chip ${heat.hot?'hot':''}">${heat.t}</span>` : ''}
        ${p.season_hr ? `<span class="chip">${p.season_hr} HR THIS SEASON</span>` : ''}
        ${parkNote}${h2h}
      </div>
      <div class="foot"><span>MOMO ${p.momo ?? '—'}${(p.momi&&p.momi!==p.momo)?(' → '+p.momi):''}</span><span>TEAM TOTAL ${p.team_total ?? '—'}</span></div>
    </div>`;
  el.addEventListener('click', () => { el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 500); boom(el); });
  return el;
}

// ── launch map (SVG) ──
function drawField(picks){
  const svg = $('#field');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent||svg).appendChild(n); return n;
  };
  const HX = 500, HY = 520;         // home plate
  const WALL = 330, MAXR = 505;     // outfield wall radius, deepest seat
  const C45 = Math.SQRT1_2;         // foul-line direction (45°)

  // grass + dirt
  mk('path', {d:`M ${HX} ${HY} L ${HX-WALL*C45} ${HY-WALL*C45} A ${WALL} ${WALL} 0 0 1 ${HX+WALL*C45} ${HY-WALL*C45} Z`, fill:'#7fae63'});
  // bleachers bands
  for (let i=0;i<4;i++){
    const r0 = WALL + 31 + i*40;
    mk('path', {d:`M ${HX-r0*C45} ${HY-r0*C45} A ${r0} ${r0} 0 0 1 ${HX+r0*C45} ${HY-r0*C45}`,
      fill:'none', stroke: i%2 ? '#c9c5ba' : '#b7b3a6', 'stroke-width':40});
  }
  // wall
  mk('path', {d:`M ${HX-WALL*C45} ${HY-WALL*C45} A ${WALL} ${WALL} 0 0 1 ${HX+WALL*C45} ${HY-WALL*C45}`,
    fill:'none', stroke:'#080808', 'stroke-width':6});
  // infield diamond + mound
  mk('path', {d:`M ${HX} ${HY} L ${HX-92} ${HY-92} L ${HX} ${HY-184} L ${HX+92} ${HY-92} Z`, fill:'#c99a5b', stroke:'#080808', 'stroke-width':3});
  mk('circle', {cx:HX, cy:HY-92, r:16, fill:'#c99a5b', stroke:'#080808', 'stroke-width':3});
  // foul lines
  mk('line', {x1:HX, y1:HY, x2:HX-MAXR*C45, y2:HY-MAXR*C45, stroke:'#fff', 'stroke-width':3});
  mk('line', {x1:HX, y1:HY, x2:HX+MAXR*C45, y2:HY-MAXR*C45, stroke:'#fff', 'stroke-width':3});

  if (!picks.length) return;
  const maxLift = Math.max(...picks.map(liftOf), 2.2);
  picks.forEach((p, i) => {
    const lift = liftOf(p);
    // spray angle: spread across fair territory, ranked center-out
    const angles = [90, 113, 67, 125, 55, 101, 79];
    const aDeg = angles[i % angles.length];
    const a = aDeg * Math.PI/180;
    // distance: wall + normalized lift into the seats
    const depth = WALL + 40 + (Math.min(lift,maxLift)/maxLift) * (MAXR - WALL - 70);
    const x2 = HX + Math.cos(a)*depth, y2 = HY - Math.sin(a)*depth;
    const tc = TEAM_COLORS[p.team] || '#333';

    // trajectory arc
    const mx = (HX+x2)/2, my = Math.min(HY - Math.sin(a)*depth*0.72, y2) - 90;
    const path = mk('path', {d:`M ${HX} ${HY-14} Q ${mx} ${my} ${x2} ${y2}`,
      fill:'none', stroke:tc, 'stroke-width':3.5, 'stroke-dasharray':'2 7', 'stroke-linecap':'round', opacity:.9});
    const len = path.getTotalLength();
    path.style.strokeDasharray = `0 ${len}`;
    path.animate([{strokeDasharray:`0 ${len}`},{strokeDasharray:`${len} 0`}],
      {duration:900, delay:350+i*420, fill:'forwards', easing:'cubic-bezier(.3,.6,.4,1)'});

    // ball flying along the arc
    const ball = mk('g', {opacity:0});
    mk('circle', {cx:0, cy:0, r:9, fill:'#fff', stroke:'#080808','stroke-width':2.5}, ball);
    mk('path', {d:'M -4 -6 Q 0 0 -4 6 M 4 -6 Q 0 0 4 6', stroke:'#c22', 'stroke-width':1.4, fill:'none'}, ball);
    ball.animate([{opacity:0},{opacity:1,offset:.01},{opacity:1}], {duration:900, delay:350+i*420, fill:'forwards'});
    // manual path-follow
    const t0 = performance.now() + 350 + i*420;
    (function fly(){
      const t = (performance.now() - t0) / 900;
      if (t >= 1){ ball.setAttribute('transform', `translate(${x2} ${y2})`); land(); return; }
      if (t >= 0){
        const pt = path.getPointAtLength(len * Math.min(Math.max(t,0),1));
        ball.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      }
      requestAnimationFrame(fly);
    })();

    function land(){
      const burst = mk('g', {transform:`translate(${x2} ${y2})`});
      for (let s=0;s<8;s++){
        const ba = s/8*Math.PI*2;
        const ln = mk('line', {x1:0,y1:0,x2:Math.cos(ba)*20,y2:Math.sin(ba)*20, stroke:'#FFEA00','stroke-width':4,'stroke-linecap':'round'});
        burst.appendChild(ln);
        ln.animate([{opacity:1, transform:'scale(.2)'},{opacity:0, transform:'scale(1.4)'}], {duration:520, fill:'forwards'});
      }
      // number badge
      const badge = mk('g', {transform:`translate(${x2} ${y2})`, style:'cursor:pointer'});
      mk('circle', {cx:0, cy:0, r:15, fill:'#080808'}, badge);
      mk('circle', {cx:0, cy:0, r:15, fill:'none', stroke:tc, 'stroke-width':3.5}, badge);
      const tx2 = mk('text', {x:0, y:5.5, 'text-anchor':'middle', fill:'#FFEA00',
        style:'font-family:Anton,sans-serif;font-size:16px'}, badge);
      tx2.textContent = i+1;
      const label = mk('text', {x:0, y:-24, 'text-anchor':'middle', fill:'#080808',
        style:`font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;paint-order:stroke;stroke:#f4f2ec;stroke-width:4px`}, badge);
      label.textContent = `${(p.name||'').split(' ').slice(-1)[0].toUpperCase()} ${lift.toFixed(1)}×`;
      badge.addEventListener('click', () => {
        const el = document.querySelectorAll('#core .pick')[i];
        if (el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),600); }
      });
      badge.animate([{opacity:0},{opacity:1}], {duration:250, fill:'forwards'});
    }
  });
}

// ── confetti ──
const cv = $('#confetti'), cx2 = cv.getContext('2d');
let confetti = [];
function sizeCanvas(){ cv.width = innerWidth; cv.height = innerHeight; }
sizeCanvas(); addEventListener('resize', sizeCanvas);
function boom(el){
  const r = el.getBoundingClientRect();
  const ox = r.left + r.width/2, oy = r.top + 40;
  const cols = ['#FFEA00','#080808','#fff','#FF3333','#00A334'];
  for (let i=0;i<70;i++){
    confetti.push({x:ox, y:oy, vx:(Math.random()-.5)*11, vy:-4-Math.random()*7,
      s:4+Math.random()*5, c:cols[i%cols.length], a:Math.random()*Math.PI, va:(Math.random()-.5)*.3, life:1});
  }
}
(function tickConfetti(){
  cx2.clearRect(0,0,cv.width,cv.height);
  confetti = confetti.filter(p => p.life > 0);
  for (const p of confetti){
    p.x += p.vx; p.y += p.vy; p.vy += .28; p.a += p.va; p.life -= .012;
    cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.a); cx2.globalAlpha = Math.max(p.life,0);
    cx2.fillStyle = p.c; cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx2.restore();
  }
  requestAnimationFrame(tickConfetti);
})();

// ── load ──
let corePicks = [];
async function load(){
  let audit = null;
  try {
    const r = await fetch('../mlbsim/hr_lotto_audit.json', {cache:'no-store'});
    if (r.ok) audit = await r.json();
  } catch(e){}
  if (!audit || !(audit.core||[]).length){
    $('#tdate').textContent = 'NO SLATE YET';
    $('#core').innerHTML = '<div class="empty">No board yet — lineups have not posted.</div>';
    document.querySelector('.field-box').style.display = 'none';
    return;
  }
  $('#tdate').textContent = (audit.generated||'').slice(0,10);
  corePicks = (audit.core||[]).slice(0,7);
  const coreEl = $('#core');
  corePicks.forEach((p,i) => coreEl.appendChild(card(p, i, true)));
  const watch = (audit.watch||[]).slice(0,6);
  if (watch.length){
    $('#watchwrap').style.display = '';
    watch.forEach((p,i) => $('#watch').appendChild(card(p, i, false)));
  }
  drawField(corePicks);
  // animate meters in
  requestAnimationFrame(() => {
    document.querySelectorAll('.meter .fill').forEach(f => { f.style.width = f.dataset.w + '%'; });
  });
}
$('#replay').addEventListener('click', () => drawField(corePicks));
load();
</script>
