<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Ledger 2025-26 · Morello Sims</title>
<meta name="description" content="Every NBA pick, in units, by day. Wins and losses.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--stock:#F3ECDC;--card:#FBF7EE;--ink:#1C1816;--muted:#70665A;--line:#D9CFBB;--house:#1238D6;
  --win:#14804A;--loss:#B0201E;--push:#8A8070;--empty:#E6DDC9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--stock);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;line-height:1.45}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.k{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.black{font-family:"Archivo Black",sans-serif}
.cond{font-family:"Barlow Condensed",sans-serif;font-weight:700}
.bar{position:sticky;top:0;z-index:20;background:rgba(243,236,220,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:1px}
.brand img{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;text-decoration:none;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:10px;padding:9px 14px;font-size:12px;background:var(--house);color:var(--stock)}

.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(40px,9vw,84px);line-height:.9;text-transform:uppercase;margin:8px 0 14px}
.big{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:14px 0}
.big .u{font-size:clamp(60px,15vw,128px);line-height:.85}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px}
.stats b{font-family:"Archivo Black";font-size:clamp(20px,4.6vw,30px);display:block;line-height:1.05}
.stats span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.facts{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch}
.fact{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left}
.fact b{display:block;font-family:"Archivo Black";font-size:18px}
.fact span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.fact:hover,.fact:focus-visible{border-color:var(--ink)}

.sec{padding:22px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.head h2{font-size:clamp(28px,6vw,44px);line-height:.9;text-transform:uppercase}

.chart{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 10px 6px;position:relative}
.chart svg{width:100%;height:220px;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--stock);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.tab{flex:none;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--stock)}

.months{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.months{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.months{grid-template-columns:1fr 1fr 1fr}}
.month{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mh b{font-family:"Archivo Black";font-size:22px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{font-size:10px;color:var(--muted);text-align:center;letter-spacing:1px}
.day{aspect-ratio:1/1.05;border-radius:9px;background:var(--empty);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;text-align:left;min-width:0}
.day i{font-style:normal;font-size:10px;color:var(--muted)}
.day b{font-family:"Barlow Condensed";font-size:clamp(13px,3.6vw,17px);line-height:1;color:#fff;text-align:center}
.day.has i{color:rgba(255,255,255,.85)}
.day.has{transition:transform .1s, box-shadow .1s}
.day.has:hover,.day.has:focus-visible{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.18);outline:none}
.day.sel{outline:3px solid var(--ink);outline-offset:1px}
.day.off{visibility:hidden}

.list{display:grid;gap:8px}
.lr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.lr:hover{border-color:var(--ink)}
.res{font-family:"Archivo Black";font-size:12px;border-radius:8px;padding:4px 7px;color:#fff}
.res.W{background:var(--win)}.res.L{background:var(--loss)}.res.P{background:var(--push)}
.u.pos{color:var(--win)}.u.neg{color:var(--loss)}

/* day sheet */
.scrim{position:fixed;inset:0;background:rgba(22,20,15,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--stock);border-radius:24px 24px 0 0;padding:16px 16px 28px;transform:translateY(105%);transition:transform .22s ease}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
@media(min-width:820px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:24px 0 0 24px;transform:translateX(105%)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sh h3{font-size:clamp(20px,6vw,26px);text-transform:uppercase}
.nav{display:flex;gap:6px}
.nav button{border:2px solid var(--ink);border-radius:10px;width:38px;height:38px;font-weight:700}
.daytot{display:flex;gap:16px;align-items:baseline;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 0;margin-bottom:12px}
.daytot b{font-family:"Archivo Black";font-size:40px;line-height:1}
.pk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.pk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--team,#999)}
.pk .t1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pk .pick{font-family:"Barlow Condensed";font-weight:700;font-size:30px;line-height:1;text-transform:uppercase}
.pk .mu{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.pk .why{font-size:13px;margin-top:8px}
.pk .meta{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.5px}
.late{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px}
.close{border:2px solid var(--ink);border-radius:10px;width:38px;height:38px;font-weight:700;font-size:14px}
footer{border-top:3px solid var(--ink);padding:18px 0 40px;font-size:12px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="/"><img src="/favicon.svg" alt=""> MORELLO SIMS</a>
  <a class="pill" href="/#join">Get the picks</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="tabs" id="seasons"></div>
    <div class="k" id="kick">NBA · every itemized pick</div>
    <h1 class="black">The ledger.</h1>
    <div class="big">
      <div class="u black" id="units">—</div>
      <div class="stats">
        <div><b id="rec">—</b><span>record</span></div>
        <div><b id="roi">—</b><span>roi</span></div>
        <div><b id="n">—</b><span>picks</span></div>
      </div>
    </div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="sec">
    <div class="head"><h2 class="black">Running units</h2><div class="k">tap a point</div></div>
    <div class="chart"><svg id="chart" role="img" aria-label="Running units by day"></svg><div class="tip" id="tip"></div></div>
  </section>

  <section class="sec">
    <div class="head"><h2 class="black">Every day</h2><div class="k">tap a day</div></div>
    <div class="tabs" id="tabs"></div>
    <div class="months" id="months"></div>
  </section>

  <section class="sec">
    <div class="head"><h2 class="black">Every pick</h2><div class="k" id="listk"></div></div>
    <div class="list" id="list"></div>
  </section>

  <footer>
    <p id="note"></p>
  </footer>
</main>

<div id="sheetwrap">
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sht">
    <div class="sh"><h3 class="black" id="sht">—</h3>
      <div class="nav"><button id="prev" aria-label="Previous pick day">‹</button><button id="next" aria-label="Next pick day">›</button><button class="close" id="close" aria-label="Close">✕</button></div></div>
    <div class="daytot"><b id="dtot">—</b><span class="k" id="drec"></span></div>
    <div id="dpicks"></div>
  </aside>
</div>

<script>
const fmtU = v => (Math.abs(v)<0.05 ? "0.0" : (v>0?"+":"−") + Math.abs(v).toFixed(1)) + "u";
const cls = v => v>0?"pos":v<0?"neg":"";
let D, byDay, days, sel=null, month="ALL";

const SEASON = new URLSearchParams(location.search).get("s") || "2025-26";
fetch("seasons.json").then(r=>r.json()).then(list=>{ if(list.length>1){
  document.getElementById("seasons").innerHTML=list.slice().reverse().map(s=>`<a class="tab" href="?s=${s}" aria-pressed="${s===SEASON}">${s}</a>`).join("");}}).catch(()=>{});
fetch(SEASON+".json").then(r=>r.json()).then(d=>{D=d; document.title=`NBA Ledger ${d.season} · Morello Sims`;
  document.getElementById("kick").textContent=`NBA ${d.season} · every itemized pick`; init();});

function init(){
  const s=D.summary;
  byDay={}; D.picks.forEach(p=>(byDay[p.date]=byDay[p.date]||[]).push(p));
  days=Object.keys(byDay).sort();
  const tot=d=>byDay[d].reduce((a,p)=>a+p.units,0);
  document.getElementById("units").textContent=fmtU(s.units);
  document.getElementById("units").style.color=s.units>=0?"var(--win)":"var(--loss)";
  document.getElementById("rec").textContent=`${s.w}-${s.l}${s.p?"-"+s.p:""}`;
  document.getElementById("roi").textContent=(s.roi>=0?"+":"")+s.roi+"%";
  document.getElementById("n").textContent=s.picks;
  // facts: clickable
  const best=days.reduce((a,b)=>tot(b)>tot(a)?b:a), worst=days.reduce((a,b)=>tot(b)<tot(a)?b:a);
  const months=[...new Set(days.map(d=>d.slice(0,7)))];
  const mt=m=>days.filter(d=>d.startsWith(m)).reduce((a,d)=>a+tot(d),0);
  const bestM=months.reduce((a,b)=>mt(b)>mt(a)?b:a);
  const up=days.filter(d=>tot(d)>0).length, down=days.filter(d=>tot(d)<0).length;
  const mname=m=>new Date(m+"-15").toLocaleString("en-US",{month:"short"}).toUpperCase();
  document.getElementById("facts").innerHTML=[
    [`${fmtU(tot(best))}`,`best day · ${pretty(best,true)}`,`day:${best}`],
    [`${fmtU(tot(worst))}`,`worst day · ${pretty(worst,true)}`,`day:${worst}`],
    [`${fmtU(mt(bestM))}`,`best month · ${mname(bestM)}`,`month:${bestM}`],
    [`${up} / ${down}`,`up days / down days`,`month:ALL`],
  ].map(([b,s,a])=>`<button class="fact" data-a="${a}"><b>${b}</b><span>${s}</span></button>`).join("");
  document.querySelectorAll(".fact").forEach(el=>el.onclick=()=>{const [k,v]=el.dataset.a.split(":");
    if(k==="day"){openDay(v)}else{setMonth(v);document.getElementById("months").scrollIntoView({behavior:"smooth",block:"start"})}});
  // tabs
  document.getElementById("tabs").innerHTML=["ALL",...months].map(m=>
    `<button class="tab" data-m="${m}" aria-pressed="${m===month}">${m==="ALL"?"All":mname(m)+" "+fmtU(mt(m))}</button>`).join("");
  document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>setMonth(el.dataset.m));
  document.getElementById("note").innerHTML=`1u = ${D.unit_pp} $PP, the standard stake. Spreads graded at the posted price (−110 unless another price was logged). `+
    `Only finished games appear. Picks the owner kept after a late log are tagged <span class="late">logged late</span>. `+
    `Before ${pretty(s.first)} the season was tracked as totals only, so those days aren't itemized here. Updated ${D.generated}.`;
  render(); chart();
  document.getElementById("scrim").onclick=closeDay; document.getElementById("close").onclick=closeDay;
  document.getElementById("prev").onclick=()=>step(-1); document.getElementById("next").onclick=()=>step(1);
  document.addEventListener("keydown",e=>{if(!sel)return; if(e.key==="Escape")closeDay(); if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1);});
  const h=location.hash.match(/^#(\d{4}-\d{2}-\d{2})$/); if(h&&byDay[h[1]])openDay(h[1]);
}
function pretty(d,short){const x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-US",short?{month:"short",day:"numeric"}:{weekday:"short",month:"short",day:"numeric"});}
function color(v){if(Math.abs(v)<0.05)return"var(--push)";const a=Math.min(1,.35+Math.abs(v)/3*.65);
  return v>0?`rgba(20,128,74,${a})`:`rgba(176,32,30,${a})`;}
function setMonth(m){month=m;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.m===m));render();}
function render(){
  const ms=[...new Set(days.map(d=>d.slice(0,7)))].filter(m=>month==="ALL"||m===month);
  const dt=d=>byDay[d]?byDay[d].reduce((a,p)=>a+p.units,0):null;
  document.getElementById("months").innerHTML=ms.map(m=>{
    const [y,mo]=m.split("-").map(Number), first=new Date(y,mo-1,1).getDay(), n=new Date(y,mo,0).getDate();
    const mtot=days.filter(d=>d.startsWith(m)).reduce((a,d)=>a+dt(d),0);
    let cells="";for(let i=0;i<first;i++)cells+=`<span class="day off"></span>`;
    for(let i=1;i<=n;i++){const d=`${m}-${String(i).padStart(2,"0")}`, v=dt(d);
      cells+= v===null?`<span class="day"><i>${i}</i></span>`
        :`<button class="day has${sel===d?" sel":""}" data-d="${d}" style="background:${color(v)}" aria-label="${pretty(d)}: ${fmtU(v)}"><i>${i}</i><b>${fmtU(v).replace("u","")}</b></button>`;}
    return `<div class="month"><div class="mh"><b>${new Date(y,mo-1,1).toLocaleString("en-US",{month:"long"})}</b><span class="u ${cls(mtot)} black">${fmtU(mtot)}</span></div>
      <div class="dow">${"SMTWTFS".split("").map(c=>`<span>${c}</span>`).join("")}</div><div class="grid">${cells}</div></div>`;}).join("");
  document.querySelectorAll(".day.has").forEach(b=>b.onclick=()=>openDay(b.dataset.d));
  const ps=D.picks.filter(p=>month==="ALL"||p.date.startsWith(month)).slice().reverse();
  document.getElementById("listk").textContent=`${ps.length} picks`;
  document.getElementById("list").innerHTML=ps.map(p=>`<button class="lr" data-d="${p.date}"><span class="res ${p.result}">${p.result}</span>
    <span><b class="cond" style="font-size:20px">${p.pick}</b> <span class="k">${p.away} @ ${p.home} · ${pretty(p.date,true)}</span></span>
    <b class="u ${cls(p.units)} black">${fmtU(p.units)}</b></button>`).join("");
  document.querySelectorAll(".lr").forEach(b=>b.onclick=()=>openDay(b.dataset.d));
}
function chart(){
  const svg=document.getElementById("chart"), W=svg.clientWidth||700, H=220, pad=26;
  let run=0; const pts=days.map(d=>{run+=byDay[d].reduce((a,p)=>a+p.units,0);return{d,v:run}});
  const xs=i=>pad+i*(W-2*pad)/Math.max(1,pts.length-1);
  const lo=Math.min(0,...pts.map(p=>p.v)), hi=Math.max(0,...pts.map(p=>p.v));
  const ys=v=>H-pad-(v-lo)*(H-2*pad)/((hi-lo)||1);
  const path=pts.map((p,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join("");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=`<line x1="${pad}" x2="${W-pad}" y1="${ys(0)}" y2="${ys(0)}" stroke="#D9CFBB" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="${path} L${xs(pts.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="rgba(18,56,214,.10)"/>
    <path d="${path}" fill="none" stroke="#1238D6" stroke-width="3.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3" fill="#1238D6"/><circle cx="${xs(i)}" cy="${ys(p.v)}" r="13" fill="transparent" data-i="${i}" style="cursor:pointer"/>`).join("")}
    <text x="${W-pad}" y="${ys(pts.at(-1).v)-10}" text-anchor="end" font-family="Archivo Black" font-size="16" fill="#1C1816">${fmtU(pts.at(-1).v)}</text>`;
  const tip=document.getElementById("tip");
  svg.querySelectorAll("circle[data-i]").forEach(c=>{const p=pts[+c.dataset.i];
    const show=()=>{const r=svg.getBoundingClientRect(),k=r.width/W;tip.style.left=(c.cx.baseVal.value*k+12)+"px";tip.style.top=(c.cy.baseVal.value*k+12)+"px";
      tip.textContent=`${pretty(p.d,true)} · ${fmtU(p.v)} running`;tip.style.opacity=1;};
    c.onmouseenter=show; c.onmouseleave=()=>tip.style.opacity=0; c.onclick=()=>openDay(p.d);});
}
function openDay(d){
  sel=d; const ps=byDay[d], t=ps.reduce((a,p)=>a+p.units,0);
  const w=ps.filter(p=>p.result==="W").length,l=ps.filter(p=>p.result==="L").length,pu=ps.filter(p=>p.result==="P").length;
  document.getElementById("sht").textContent=pretty(d);
  const dt=document.getElementById("dtot"); dt.textContent=fmtU(t); dt.className="u "+cls(t);
  document.getElementById("drec").textContent=`${w}-${l}${pu?"-"+pu:""} · ${ps.length} pick${ps.length>1?"s":""}`;
  document.getElementById("dpicks").innerHTML=ps.map(p=>{
    const side=p.pick.split(" ")[0], team=(D.teams[side]||{}), opp=side===p.away?p.home:p.away;
    const why = p.sim_margin!=null ? `Sim had ${team.name||side} ${p.sim_margin>=0?"winning":"losing"} by ${Math.abs(p.sim_margin).toFixed(1)} · ${p.edge} pts of edge`
              : (p.edge!=null?`${p.edge} pts of edge`:"");
    return `<div class="pk" style="--team:${team.c||"#999"}">
      <div class="t1"><div><div class="pick">${p.pick} <span class="k" style="font-size:12px">${p.odds||""}</span></div>
        <div class="mu">${p.away} @ ${p.home} · final ${p.final||"—"}</div></div>
        <div style="text-align:right"><span class="res ${p.result}">${p.result==="W"?"WIN":p.result==="L"?"LOSS":"PUSH"}</span>
        <div class="u ${cls(p.units)} black" style="font-size:22px;margin-top:6px">${fmtU(p.units)}</div></div></div>
      ${why?`<div class="why">${why}${p.conf?` · C${p.conf}`:""}</div>`:""}
      <div class="meta">risk ${p.stake_u}u${p.logged?` · logged ${p.logged}`:""}${p.late?`<span class="late">logged late</span>`:""}</div></div>`;}).join("");
  document.getElementById("sheetwrap").className="open";
  history.replaceState(null,"","#"+d); render();
}
function closeDay(){sel=null;document.getElementById("sheetwrap").className="";history.replaceState(null,"",location.pathname);render();}
function step(k){const i=days.indexOf(sel)+k; if(i>=0&&i<days.length)openDay(days[i]);}
</script>
</body>
</html>
