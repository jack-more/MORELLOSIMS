name: TG Channel Bot

# @MorelloSimsBot — premium channel gatekeeper.
#
# scripts/tg_channel_bot.py was written to "run stateless on a cron" but that
# cron never existed: the script has not executed since it was committed by
# hand on 2026-07-05. This workflow is that missing cron.
#
# Each run drains getUpdates and:
#   - answers /start DMs with the pitch + checkout link
#   - approves channel join requests from active subscribers
#   - declines everyone else (and DMs them the checkout link)
#   - removes subscribers whose access expired
#
# Telegram only retains updates for ~24h, so a join request that arrives while
# this workflow is not polling is lost for good. Hence the tight interval.
#
# State (telegram/bot_state.json offset + subscribers.json kicked flags) is
# committed back, because getUpdates is destructive: without a persisted
# offset every run would re-process and re-pitch the same people.

on:
  schedule:
    # Every 15 minutes — join requests should not sit unanswered for long,
    # and must be handled inside Telegram's 24h update retention window.
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      command:
        description: 'Bot command'
        required: true
        default: 'list'
        type: choice
        options:
          - list    # read-only: print the subscriber ledger
          - run     # live: approve/decline/kick + send DMs
      photo:
        description: 'post only: path to card PNG'
        required: false
        type: string
      caption:
        description: 'post only: caption'
        required: false
        default: ''
        type: string

# Serialize. Two overlapping runs would both drain getUpdates from the same
# offset and double-send, then race on the state commit.
concurrency:
  group: tg-channel-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run channel bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PREMIUM_CHANNEL_ID: ${{ secrets.TELEGRAM_PREMIUM_CHANNEL_ID }}
        run: |
          set -euo pipefail

          # No-op cleanly while the channel is still being set up, matching
          # social-daily.yml. Without the channel id the bot would still answer
          # /start DMs but silently ignore every join request — half-running the
          # gatekeeper is worse than not running it.
          if [ -z "${TELEGRAM_PREMIUM_CHANNEL_ID}" ]; then
            echo "TELEGRAM_PREMIUM_CHANNEL_ID not set — premium channel not configured yet."
            echo "Skipping. See scripts/tg_channel_bot.py docstring for channel setup."
            exit 0
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set — skipping."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            CMD="run"
          else
            CMD="${{ inputs.command }}"
          fi

          echo "=== tg_channel_bot.py ${CMD} ==="
          python3 scripts/tg_channel_bot.py "${CMD}"

      - name: Commit bot state
        if: github.event_name == 'schedule' || inputs.command == 'run'
        run: |
          set -euo pipefail
          git config user.name "TG Channel Bot"
          git config user.email "noreply@github.com"
          git add telegram/bot_state.json telegram/subscribers.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change to commit"
          else
            git commit -m "TG bot — $(TZ=America/New_York date +'%b %d %I:%M %p ET') — state sync"
            git push || { git fetch origin && git rebase -X theirs origin/main && git push; }
          fi
