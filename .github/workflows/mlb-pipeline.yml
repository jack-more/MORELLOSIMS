name: MLB Pipeline

on:
  schedule:
    # 1) Early morning — 7 AM ET (11:00 UTC)
    #    Atlas refresh + first picks. Projected lineups from RotoWire/BaseballMonster.
    - cron: '0 11 * * *'

    # 2) Mid-morning — 10 AM ET (14:00 UTC)
    #    Refresh lineups. Many day game lineups confirmed by now.
    - cron: '0 14 * * *'

    # 3) Noon — 12 PM ET (16:00 UTC)
    #    Last refresh before early games (some start 12:35 PM ET)
    - cron: '0 16 * * *'

    # 4) Afternoon — 3 PM ET (19:00 UTC)
    #    Night game lineups dropping. Refresh for evening slate.
    - cron: '0 19 * * *'

    # 5) Pre-game — 6 PM ET (22:00 UTC)
    #    Final refresh. Most 7 PM lineups locked.
    - cron: '0 22 * * *'

    # 6) Late slate — 7 PM ET (23:00 UTC)
    #    Catch late lineup and HR card changes before West Coast games.
    - cron: '0 23 * * *'

    # 7) West Coast final — 8 PM ET (00:00 UTC)
    #    Last pregame pass for late starts.
    - cron: '0 0 * * *'

    # 8) Settle — 2 AM ET (06:00 UTC)
    #    All games done, mark results overnight.
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      run_type:
        description: 'What to run'
        required: true
        default: 'picks'
        type: choice
        options:
          - picks
          - atlas-refresh
          - both

permissions:
  contents: write

jobs:
  atlas-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_type == 'atlas-refresh' || inputs.run_type == 'both') ||
      github.event.schedule == '0 11 * * *'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pybaseball numpy pandas requests

      - name: Refresh 2026 atlas
        run: python3 scripts/refresh_atlas_2026.py

      - name: Refresh team bullpen + SP innings tables
        # Cheap (1 MLB API call). Output drives the bullpen run-delta in
        # build_mlb_sim.py — without it, bullpen adjustment silently skips.
        run: python3 scripts/07_fetch_bullpen.py

      - name: Commit atlas updates
        run: |
          git config user.name "MLB Pipeline Bot"
          git config user.email "noreply@github.com"
          git add atlas/
          if git diff --cached --quiet; then
            echo "No atlas changes to commit"
          else
            git commit -m "Atlas refresh — $(TZ=America/New_York date +'%b %d %I:%M %p ET')"
            git push
          fi

  generate-picks:
    runs-on: ubuntu-latest
    needs: [atlas-refresh]
    timeout-minutes: 60
    if: >-
      always() &&
      (needs.atlas-refresh.result == 'success' || needs.atlas-refresh.result == 'skipped') &&
      github.event.schedule != '0 6 * * *'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Pull latest (in case atlas job pushed)
        run: git pull origin main

      - name: Generate MLB picks
        timeout-minutes: 45
        # set -o pipefail so a build_mlb_sim crash fails the workflow
        # (without it, the pipe to `tee` returns 0 even when python3 crashes)
        run: |
          set -o pipefail
          python3 scripts/build_mlb_sim.py 2>&1 | tee /tmp/mlb_output.txt

      - name: Guard MLB MOMO/MOMI scores
        run: python3 scripts/check_mlb_momo_guardrails.py

      - name: Verify MLB publish freshness
        run: python3 scripts/verify_mlb_publish.py --max-age-minutes 90 --require-hr-h2h-lane

      - name: Render MLB social card
        run: python3 scripts/render_mlb_social_card.py --out posters/mlb-social-card.png

      # NOTE: index.html rendering is owned by render-dispatch.yml (Dispatch Bot).
      # That workflow auto-triggers when picks/mlb.json is pushed below.
      - name: Commit and push
        run: |
          git config user.name "MLB Pipeline Bot"
          git config user.email "noreply@github.com"
          PICKS=$(grep "PICKS:" /tmp/mlb_output.txt | sed 's/.*PICKS: //')
          git add mlbsim/index.html mlbsim/picks_log.csv picks/mlb.json posters/mlb-social-card.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "MLB SIM — $(TZ=America/New_York date +'%b %d %I:%M %p ET') — ${PICKS}"
            git push
          fi

  settle-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event.schedule == '0 6 * * *'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Settle yesterday's MLB picks
        timeout-minutes: 45
        # set -o pipefail so a settle script crash fails the workflow
        # (the bare pipe to `tee` was hiding crashes for days, leaving picks
        # stuck pending while still committing a "Settle MLB" commit).
        run: |
          set -o pipefail
          python3 scripts/settle_mlb.py 2>&1 | tee /tmp/mlb_output.txt

      - name: Generate today's MLB picks
        timeout-minutes: 45
        run: |
          set -o pipefail
          python3 scripts/build_mlb_sim.py 2>&1 | tee -a /tmp/mlb_output.txt

      - name: Guard MLB MOMO/MOMI scores
        run: python3 scripts/check_mlb_momo_guardrails.py

      - name: Verify MLB publish freshness
        run: python3 scripts/verify_mlb_publish.py --max-age-minutes 90 --require-hr-h2h-lane

      - name: Render MLB social card
        run: python3 scripts/render_mlb_social_card.py --out posters/mlb-social-card.png

      # NOTE: index.html rendering is owned by render-dispatch.yml (Dispatch Bot).
      # That workflow auto-triggers when picks/mlb.json is pushed below.
      - name: Commit and push
        run: |
          git config user.name "MLB Pipeline Bot"
          git config user.email "noreply@github.com"
          PICKS=$(grep "PICKS:" /tmp/mlb_output.txt | sed 's/.*PICKS: //')
          git add mlbsim/index.html mlbsim/picks_log.csv picks/mlb.json posters/mlb-social-card.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Settle MLB — $(TZ=America/New_York date +'%b %d %I:%M %p ET') — ${PICKS}"
            git push
          fi
