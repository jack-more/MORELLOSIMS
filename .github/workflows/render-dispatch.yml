name: Render Dispatch

# Sole writer of index.html.
# Triggered when either sport pushes a fresh picks/*.json. Runs render_dispatch.py
# to regenerate the dispatch log block from current pick data and commits.
#
# Why this exists:
#   Both MLB and NBA pipelines used to write index.html themselves, which caused
#   the homepage blog to flicker between sports' versions and made it impossible
#   to enforce "one bot, one lane" guarantees. Splitting render into its own
#   workflow with a dedicated bot identity means each sport pipeline writes
#   ONLY its own files; this workflow is the single owner of index.html.

on:
  # workflow_run instead of push, because GitHub's default GITHUB_TOKEN
  # does NOT trigger downstream `push` workflows (anti-loop protection).
  # We instead chain off the upstream sport pipelines completing.
  workflow_run:
    workflows: ["MLB Pipeline", "NBA Pipeline"]
    types: [completed]
  workflow_dispatch:

# Serialize renders. Two near-simultaneous sport pushes will queue and both run;
# we don't want to cancel an in-progress render because the next picks push may
# arrive before we've published the previous one.
concurrency:
  group: render-dispatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only render when the upstream sport pipeline succeeded (or this was
    # triggered manually). Don't waste cycles rendering on top of a failed run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull latest (in case sport pipelines pushed during this run)
        run: git pull origin main

      - name: Render dispatch log
        run: python3 scripts/render_dispatch.py

      - name: Commit and push (if changed)
        run: |
          git config user.name "Dispatch Bot"
          git config user.email "noreply@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No dispatch changes to commit"
            exit 0
          fi
          git commit -m "Render dispatch log — $(TZ=America/New_York date +'%b %d %I:%M %p ET')"
          git push
