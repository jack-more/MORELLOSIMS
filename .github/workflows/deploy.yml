name: Deploy to Firebase Hosting

# Auto-deploys main → morellosims.com on every push.
# Without this, the MLB/NBA pipelines push to GitHub but the live site never updates.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't queue a backlog if multiple commits land within seconds.
concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, eve of NBA opener
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT_MORELLO_SIMS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MORELLO_SIMS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_MORELLO_SIMS" ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_MORELLO_SIMS. Firebase Hosting cannot deploy from Actions until this repo secret is restored."
            exit 1
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MORELLO_SIMS }}
          channelId: live
          projectId: morello-sims
