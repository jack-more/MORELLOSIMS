name: MLB Live Healthcheck

on:
  schedule:
    - cron: '20 11 * * *'
    - cron: '20 14 * * *'
    - cron: '20 16 * * *'
    - cron: '20 19 * * *'
    - cron: '20 22 * * *'
    - cron: '20 23 * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify live MLB page freshness
        run: |
          # The pipeline sleeps 02:00-11:00 UTC (no games, no builds), and
          # GH cron drift can push a check into that window — freshness
          # there is expected staleness, not an outage.
          H=$(date -u +%H)
          if [ "$H" -ge 2 ] && [ "$H" -lt 11 ]; then
            echo "Overnight window (${H}:00 UTC) — no builds scheduled; skipping freshness check."
            exit 0
          fi
          python3 scripts/verify_mlb_publish.py --base-url https://morellosims.com --max-age-minutes 100 --require-hr-h2h-lane

      - name: Telegram alert on stale site
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🚨 MLB SIM site is STALE (healthcheck failed) — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
