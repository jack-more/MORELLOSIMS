name: NBA Pipeline

# In-repo replacement for jack-more/NBAsim's daily-update.yml.
# All NBA logic now lives in nba_pipeline/. This workflow runs that project's
# scripts in place, then builds the public page at nbasim/index.html
# with the auth injection MORELLOSIMS' navbar expects.
#
# Bot identity: "NBA Pipeline Bot"  (distinct from MLB Pipeline Bot and
# Dispatch Bot — see bot-scope-check.yml for the lane enforcement).
#
# Lane: writes ONLY nbasim/, picks/nba.json, nba_pipeline/data/, nba_pipeline/db/.
# index.html is owned exclusively by render-dispatch.yml (Dispatch Bot).

on:
  # NBAsim's old daily-update.yml cron has been disabled (May 5).
  # This workflow is now the authoritative NBA pipeline.
  schedule:
    - cron: '30 7 * * *'   # Post-game (7:30 AM UTC = 11:30 PM PST)
    - cron: '30 13 * * *'  # Morning update (1:30 PM UTC = 5:30 AM PST)
    - cron: '0 16 * * *'   # Trends refresh (4 PM UTC = 8 AM PST)
    - cron: '0 17 * * *'   # Settlement (5 PM UTC = 9 AM PST)
    - cron: '0 18 * * *'   # Pre-game (6 PM UTC = 10 AM PST)
    - cron: '30 20 3-19 10 *'  # Preseason dry run, Oct 3-19 (job dry-run only; never commits)

  workflow_dispatch:
    inputs:
      full_pipeline:
        description: 'Run full pipeline (collect + analyze + scores + predict)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      settle_only:
        description: 'Run settlement only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      trends_only:
        description: 'Run trends refresh only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      inject_pick:
        description: 'Manual pick injection — e.g. "BOS @ CLE" "BOS -0.5" --risk 50'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run: rehearse the daily pipeline on a scratch copy, preseason treated as regular season (never commits, posts or touches the ledger)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dry_run_date:
        description: 'Dry run: preseason date being rehearsed (YYYY-MM-DD, default today ET); its and the previous day''s ESPN games are synced'
        required: false
        default: ''
        type: string
      dry_run_probe_dates:
        description: 'Dry run: extra comma-separated dates whose completed games are fetched from ESPN summary (endpoint probe, no writes)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

# Prevent overlapping runs from racing on git push. Dry runs never push and
# get their own group so they can never queue behind or displace a real run.
concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') || github.event.schedule == '30 20 3-19 10 *') && 'nba-pipeline-dry-run' || 'nba-pipeline' }}
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════
  # PRE-GAME / DAILY UPDATE
  # ════════════════════════════════════════════
  update-lines:
    if: github.event.schedule != '0 17 * * *' && github.event.schedule != '0 16 * * *' && inputs.settle_only != 'true' && inputs.trends_only != 'true' && inputs.dry_run != 'true' && github.event.schedule != '30 20 3-19 10 *'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, eve of NBA opener
    timeout-minutes: 30
    env:
      # Seal mode (ops/config/monetization.json): key that seals pending picks
      # in public files until first pitch / tip. Unused while seal mode is off.
      PICKS_SEAL_KEY: ${{ secrets.PICKS_SEAL_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r nba_pipeline/requirements.txt

      # Seal mode: picks whose tip has passed go public (with the nonce that
      # proves the pre-game commitment) before capture / grading / sync.
      - name: Unseal tipped NBA picks
        run: python3 scripts/unseal_picks.py --sport nba

      - name: Refresh game scores (ESPN)
        continue-on-error: true
        timeout-minutes: 3
        working-directory: nba_pipeline
        run: |
          python -c "
          import sys, os, logging
          sys.path.insert(0, os.getcwd())
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
          from config import DB_PATH, CURRENT_SEASON
          from collectors.games_espn import ESPNGameCollector
          espn = ESPNGameCollector(DB_PATH)
          n = espn.update_games_table(CURRENT_SEASON, days=21)
          print(f'ESPN: {n} games added/updated')
          "

      - name: Refresh rosters and player stats
        continue-on-error: true
        timeout-minutes: 8
        working-directory: nba_pipeline
        run: |
          python -c "
          import sys, os, logging
          sys.path.insert(0, os.getcwd())
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
          from config import DB_PATH, CURRENT_SEASON
          from collectors.players import PlayerCollector
          print(f'Season: {CURRENT_SEASON}')
          pc = PlayerCollector(DB_PATH)
          pc.collect_teams()
          try: pc.collect_rosters(CURRENT_SEASON)
          except Exception as e: print(f'Roster refresh failed (using cached): {e}')
          try: pc.collect_player_season_stats(CURRENT_SEASON)
          except Exception as e: print(f'Player stats refresh failed (using cached): {e}')
          try: pc.collect_team_season_stats(CURRENT_SEASON)
          except Exception as e: print(f'Team stats refresh failed (using cached): {e}')
          print('=== Rosters + season stats step complete ===')
          "

      # stats.nba.com blocks Actions IPs (the step above trips its circuit
      # breaker after 2 failed calls). ESPN box scores + play-by-play keep
      # player_game_stats / player_season_stats / team_season_stats current;
      # verified against stats.nba.com 2025-26 in scripts/verify_espn_stats.py.
      - name: Box scores + season stats from ESPN (guarantees freshness)
        continue-on-error: true
        timeout-minutes: 12
        working-directory: nba_pipeline
        run: python scripts/espn_stats_sync.py

      - name: Seed new-season priors from last season (idempotent)
        working-directory: nba_pipeline
        run: python scripts/seed_season.py

      - name: Check data freshness (fails in-season when stats lag the games)
        working-directory: nba_pipeline
        run: python scripts/check_freshness.py

      - name: Run full pipeline (manual trigger only)
        if: inputs.full_pipeline == 'true'
        timeout-minutes: 20
        working-directory: nba_pipeline
        run: |
          python main.py collect --skip-boxscores 2>&1 | tail -30
          python main.py analyze 2>&1 | tail -10
          python main.py scores 2>&1 | tail -10
          python main.py predict 2>&1 | tail -10

      - name: Generate dashboard (with retry)
        working-directory: nba_pipeline
        run: |
          success=false
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            if python generate_frontend.py; then success=true; break; fi
            echo "Attempt $attempt failed, waiting 60s before retry..."
            sleep 60
          done
          if [ "$success" = false ]; then
            echo "::error::All 3 generate_frontend.py attempts failed"
            exit 1
          fi

      - name: Intelligence snapshot
        continue-on-error: true
        working-directory: nba_pipeline
        run: python scripts/snapshot_daily.py

      - name: Capture picks
        working-directory: nba_pipeline
        run: python scripts/capture_picks.py

      - name: Inject manual pick (workflow_dispatch only)
        if: inputs.inject_pick != ''
        working-directory: nba_pipeline
        run: python scripts/inject_pick.py ${{ inputs.inject_pick }}

      - name: Ledger integrity (nothing deleted, stakes frozen, captured before tip)
        working-directory: nba_pipeline
        run: python scripts/check_ledger.py

      - name: Generate blog entry
        working-directory: nba_pipeline
        run: python scripts/generate_blog_entry.py

      - name: Sync NBA picks to contract format (picks/nba.json)
        run: python3 nba_pipeline/scripts/sync_to_picks_json.py

      - name: Build public NBA dashboard at /nbasim/
        run: python3 scripts/build_nbasim_app.py

      - name: Build standalone NBA Simulator app at /sim/
        run: python3 scripts/build_sim_app.py

      - name: Commit and push
        run: |
          git config user.name "NBA Pipeline Bot"
          git config user.email "noreply@github.com"
          DATE=$(TZ='America/Los_Angeles' date '+%b %d %I:%M %p PST')

          git add nbasim/index.html
          git add sim/index.html
          git add picks/nba.json
          git add nba_pipeline/db/nba_sim.db
          # snapshot history moved out of the DB (utils/snapshot_archive.py)
          if [ -d nba_pipeline/db/archive ]; then git add nba_pipeline/db/archive; fi
          if [ -f nba_pipeline/db/.nba_api_last_refresh ]; then git add nba_pipeline/db/.nba_api_last_refresh; fi
          if [ -f nba_pipeline/data/picks.csv ]; then git add nba_pipeline/data/picks.csv; fi
          if [ -f nba_pipeline/data/pick_log.json ]; then git add nba_pipeline/data/pick_log.json; fi
          if [ -f nba_pipeline/data/blog_snippet.html ]; then git add nba_pipeline/data/blog_snippet.html; fi
          if [ -f nba_pipeline/data/daily_picks.json ]; then git add nba_pipeline/data/daily_picks.json; fi
          # Closing-line history for CLV: without committing it, every run's
          # snapshots were lost and grading never saw a closing line.
          if [ -f nba_pipeline/data/line_snapshots.csv ]; then git add nba_pipeline/data/line_snapshots.csv; fi
          # Seal mode guardrail: no staged public file may show a sealed
          # pick's side / odds / line before its game starts.
          python3 scripts/check_seal_guardrail.py

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "NBA SIM — ${DATE}"
          git pull --rebase origin main || true
          git push
      - name: Kick pick alerts (owner DM + sealed X card)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tg-channel-bot.yml --ref main -f command=run || echo "dispatch failed; the 15-min bot cron will catch it"

  # ════════════════════════════════════════════
  # DAILY TRENDS REFRESH (8 AM PST cron)
  # ════════════════════════════════════════════
  refresh-trends:
    if: github.event.schedule == '0 16 * * *' || inputs.trends_only == 'true'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, eve of NBA opener
    timeout-minutes: 30
    env:
      # Seal mode (ops/config/monetization.json): key that seals pending picks
      # in public files until first pitch / tip. Unused while seal mode is off.
      PICKS_SEAL_KEY: ${{ secrets.PICKS_SEAL_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r nba_pipeline/requirements.txt

      # Seal mode: picks whose tip has passed go public (with the nonce that
      # proves the pre-game commitment) before capture / grading / sync.
      - name: Unseal tipped NBA picks
        run: python3 scripts/unseal_picks.py --sport nba

      - name: Refresh trends (ESPN box scores + season stats, lineup stats, synergy)
        timeout-minutes: 15
        working-directory: nba_pipeline
        run: python scripts/refresh_trends.py

      # ESPN season stats replace the season's rows with teams/players that
      # have played; re-seed priors for the rest (opening week), as update-lines does.
      - name: Seed new-season priors from last season (idempotent)
        working-directory: nba_pipeline
        run: python scripts/seed_season.py

      - name: Regenerate dashboard with fresh trends
        working-directory: nba_pipeline
        run: |
          success=false
          for attempt in 1 2 3; do
            if python generate_frontend.py; then success=true; break; fi
            echo "Attempt $attempt failed, waiting 30s..."
            sleep 30
          done
          if [ "$success" = false ]; then
            echo "::error::All 3 generate_frontend.py attempts failed"
            exit 1
          fi

      - name: Intelligence snapshot
        continue-on-error: true
        working-directory: nba_pipeline
        run: python scripts/snapshot_daily.py

      - name: Capture picks
        continue-on-error: true
        working-directory: nba_pipeline
        run: python scripts/capture_picks.py

      - name: Ledger integrity (nothing deleted, stakes frozen, captured before tip)
        working-directory: nba_pipeline
        run: python scripts/check_ledger.py

      - name: Generate blog entry
        continue-on-error: true
        working-directory: nba_pipeline
        run: python scripts/generate_blog_entry.py

      - name: Sync NBA picks to contract format (picks/nba.json)
        run: python3 nba_pipeline/scripts/sync_to_picks_json.py

      - name: Build public NBA dashboard at /nbasim/
        run: python3 scripts/build_nbasim_app.py

      - name: Build standalone NBA Simulator app at /sim/
        run: python3 scripts/build_sim_app.py

      - name: Commit and push
        run: |
          git config user.name "NBA Pipeline Bot"
          git config user.email "noreply@github.com"
          DATE=$(TZ='America/Los_Angeles' date '+%b %d %I:%M %p PST')

          git add nbasim/index.html
          git add sim/index.html
          git add picks/nba.json
          git add nba_pipeline/db/nba_sim.db
          # snapshot history moved out of the DB (utils/snapshot_archive.py)
          if [ -d nba_pipeline/db/archive ]; then git add nba_pipeline/db/archive; fi
          if [ -f nba_pipeline/db/.nba_api_last_refresh ]; then git add nba_pipeline/db/.nba_api_last_refresh; fi
          if [ -f nba_pipeline/data/picks.csv ]; then git add nba_pipeline/data/picks.csv; fi
          if [ -f nba_pipeline/data/pick_log.json ]; then git add nba_pipeline/data/pick_log.json; fi
          if [ -f nba_pipeline/data/blog_snippet.html ]; then git add nba_pipeline/data/blog_snippet.html; fi
          if [ -f nba_pipeline/data/daily_picks.json ]; then git add nba_pipeline/data/daily_picks.json; fi
          # Closing-line history for CLV: without committing it, every run's
          # snapshots were lost and grading never saw a closing line.
          if [ -f nba_pipeline/data/line_snapshots.csv ]; then git add nba_pipeline/data/line_snapshots.csv; fi
          # Seal mode guardrail: no staged public file may show a sealed
          # pick's side / odds / line before its game starts.
          python3 scripts/check_seal_guardrail.py

          if git diff --cached --quiet; then
            echo "No trend changes to commit"
            exit 0
          fi

          git commit -m "NBA trends refresh — ${DATE}"
          git pull --rebase origin main || true
          git push
      - name: Kick pick alerts (owner DM + sealed X card)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tg-channel-bot.yml --ref main -f command=run || echo "dispatch failed; the 15-min bot cron will catch it"

  # ════════════════════════════════════════════
  # OPENING-WEEK DRY RUN (workflow_dispatch dry_run=true; daily Oct 3-19 cron)
  # Every update-lines step plus trends refresh and grading, run by
  # scripts/dry_run.py inside a scratch copy of the repo with NBA_DRY_RUN=1
  # (ESPN preseason games read as regular season). No commit, no bot kick,
  # read-only token; the real ledger is hashed before/after.
  # ════════════════════════════════════════════
  dry-run:
    if: (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') || github.event.schedule == '30 20 3-19 10 *'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, eve of NBA opener
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # same seal-mode key as the real jobs, so a dry run sees what they see
      PICKS_SEAL_KEY: ${{ secrets.PICKS_SEAL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r nba_pipeline/requirements.txt

      - name: ESPN summary endpoint probe (from Actions)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PROBE_DATES: ${{ inputs.dry_run_probe_dates }}
          REHEARSE: ${{ inputs.dry_run_date }}
        run: |
          D="${REHEARSE:-$(TZ=America/New_York date +%F)}"
          PREV=$(date -d "$D - 1 day" +%F)
          python3 nba_pipeline/scripts/dry_run.py probe --dates "$PREV,$D${PROBE_DATES:+,$PROBE_DATES}" --json "$RUNNER_TEMP/espn_probe.json"

      - name: Stage scratch copy
        run: python3 nba_pipeline/scripts/dry_run.py stage --out "$RUNNER_TEMP/nba-dry-run"

      - name: Rehearse the daily pipeline
        env:
          REHEARSE: ${{ inputs.dry_run_date }}
        run: |
          D="${REHEARSE:-$(TZ=America/New_York date +%F)}"
          PREV=$(date -d "$D - 1 day" +%F)
          python3 nba_pipeline/scripts/dry_run.py run --root "$RUNNER_TEMP/nba-dry-run" --date "$D" --sync-dates "$PREV,$D"

      - name: Upload dry-run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-dry-run-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/espn_probe.json
            ${{ runner.temp }}/nba-dry-run/dry_run_report.json
            ${{ runner.temp }}/nba-dry-run/log_*.txt
            ${{ runner.temp }}/nba-dry-run/nba_pipeline/data/
            ${{ runner.temp }}/nba-dry-run/nba_pipeline/index.html
            ${{ runner.temp }}/nba-dry-run/picks/nba.json

  # ════════════════════════════════════════════
  # POST-GAME SETTLEMENT
  # ════════════════════════════════════════════
  grade-picks:
    if: github.event.schedule == '0 17 * * *' || inputs.settle_only == 'true'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19, eve of NBA opener
    timeout-minutes: 15
    env:
      # Seal mode (ops/config/monetization.json): key that seals pending picks
      # in public files until first pitch / tip. Unused while seal mode is off.
      PICKS_SEAL_KEY: ${{ secrets.PICKS_SEAL_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r nba_pipeline/requirements.txt

      # Seal mode: picks whose tip has passed go public (with the nonce that
      # proves the pre-game commitment) before capture / grading / sync.
      - name: Unseal tipped NBA picks
        run: python3 scripts/unseal_picks.py --sport nba

      # Scores: ESPN first (header rotation), nba_sim.db `games` when ESPN 403s.
      - name: Grade picks
        working-directory: nba_pipeline
        run: python scripts/grade_picks.py

      - name: Ledger integrity (nothing deleted, stakes frozen, captured before tip)
        working-directory: nba_pipeline
        run: python scripts/check_ledger.py

      - name: Sync NBA picks to contract format (picks/nba.json)
        run: python3 nba_pipeline/scripts/sync_to_picks_json.py

      # nba_pipeline/index.html only exists in update-lines; refresh the card in place.
      - name: Refresh public NBA dashboard record
        run: python3 scripts/build_nbasim_app.py --record-only

      - name: Rebuild NBA season ledger page (settled picks only)
        run: |
          python3 scripts/build_nba_ledger_page.py
          python3 scripts/test_score_order.py

      - name: Commit settlement
        run: |
          git config user.name "NBA Pipeline Bot"
          git config user.email "noreply@github.com"
          DATE=$(TZ='America/Los_Angeles' date '+%b %d %I:%M %p PST')

          git add picks/nba.json
          git add nbasim/index.html
          git add ledger/nba
          if [ -f nba_pipeline/data/picks.csv ]; then git add nba_pipeline/data/picks.csv; fi
          if [ -f nba_pipeline/data/settlement_results.json ]; then git add nba_pipeline/data/settlement_results.json; fi
          # files the unseal step may have rewritten (no-op when nothing was sealed)
          if [ -f nba_pipeline/data/pick_log.json ]; then git add nba_pipeline/data/pick_log.json; fi
          if [ -f nba_pipeline/data/daily_picks.json ]; then git add nba_pipeline/data/daily_picks.json; fi
          git add nba_pipeline/db/nba_sim.db
          # Seal mode guardrail: no staged public file may show a sealed
          # pick's side / odds / line before its game starts.
          python3 scripts/check_seal_guardrail.py

          if git diff --cached --quiet; then
            echo "No settlement changes"
            exit 0
          fi

          git commit -m "NBA settle — ${DATE}"
          git pull --rebase origin main || true
          git push

      # After the commit so partial settlements still land; then fail loudly.
      - name: Guardrail — no pick pending more than 3 days after its date
        working-directory: nba_pipeline
        run: python scripts/grade_picks.py --check-stale --days 3
