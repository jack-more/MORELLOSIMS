# ZUMA staging. In Netlify: Import from Git → jack-more/morellosims → branch claude/nice-planck-sn9yd9, base directory "zuma".
# The site is prebuilt static HTML (source/build.py writes it), so there is no build command.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
