<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Ledger · Morello Sims</title>
<meta name="description" content="Every Morello Sims NBA pick, by day, in units. Losses included.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--sky:#3187DC;--sky-deep:#1F66B4;--paper:#F5F0ED;--paper-2:#FBF8F5;--ink:#14202E;--ink-2:#4B5868;--ink-3:#8A93A0;--rule:#DED5CA;--faint:#EFE8E0;--gold:#B9861B;--gold-soft:#F3E6C4;--win:#0F8A43;--loss:#B0201E;--push:#8A93A0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.label{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3)}
.pos{color:var(--win)}.neg{color:var(--loss)}

/* header: the poster sky */
.sky{background:var(--sky);color:#fff;padding:0 16px 46px}
.bar{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:2px;font-size:12px;text-decoration:none}
.brand img{width:22px;height:22px}
.nav{display:flex;gap:18px;font-style:italic;font-weight:300;font-size:14px}
.nav a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.55)}
.nav a.on{border-color:#fff;font-weight:400}
.head{max-width:1120px;margin:18px auto 0}
.head h1{font-weight:200;font-size:clamp(44px,11vw,88px);letter-spacing:-2px;line-height:.92}
.head p{font-style:italic;font-weight:300;font-size:15px;margin-top:10px}
.seasons{display:flex;gap:8px;margin-top:14px}
.seasons a{font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.6);border-radius:3px;padding:6px 10px}
.seasons a[aria-current="true"]{background:#fff;color:var(--sky-deep)}

main{max-width:1120px;margin:0 auto;padding:0 16px 60px}
.card{background:#fff;border:1px solid var(--rule);border-radius:6px}
.sec{margin-top:22px}
.sec>.label{display:flex;justify-content:space-between;margin:0 2px 10px}

/* summary */
.summary{margin-top:-26px}
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.views button{padding:13px 6px;font-size:13px;color:var(--ink-2);border-left:1px solid var(--rule);line-height:1.25}
.views button:first-child{border-left:0}
.views button[aria-pressed="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--sky)}
.big{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px;padding:22px 22px 18px}
.big .u{font-weight:200;font-size:clamp(64px,15vw,112px);letter-spacing:-3px;line-height:.85}
.stats{display:flex;gap:28px;padding-bottom:6px}
.stats b{display:block;font-weight:300;font-size:clamp(22px,5vw,30px);letter-spacing:-.5px}
.stats span{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.what{font-size:13px;color:var(--ink-2);line-height:1.5;padding:0 22px 18px}
.what b{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--rule)}
@media(min-width:720px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fact{text-align:left;padding:14px 22px;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.fact:nth-child(-n+2){border-top:0}
@media(min-width:720px){.fact{border-top:0}}
.fact:nth-child(odd){border-left:0}
@media(min-width:720px){.fact:nth-child(odd){border-left:1px solid var(--rule)}.fact:first-child{border-left:0}}
.fact b{display:block;font-weight:400;font-size:20px}
.fact span{font-size:12px;color:var(--ink-3)}
.fact:hover{background:var(--paper-2)}

/* chart */
.chart{padding:14px 10px 8px;position:relative}
.chart svg{width:100%;height:220px;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:4px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}

/* months */
.mtabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.mtab{flex:none;font-size:13px;border:1px solid var(--rule);background:#fff;border-radius:3px;padding:7px 12px;color:var(--ink-2)}
.mtab[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.months{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.months{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.months{grid-template-columns:1fr 1fr 1fr}}
.month{padding:16px}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.mh b{font-weight:300;font-size:24px}
.mh span{font-weight:600;font-size:15px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{font-size:10px;color:var(--ink-3);text-align:center;letter-spacing:1px;font-weight:600}
.day{aspect-ratio:1;border-radius:4px;background:var(--faint);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;text-align:left;min-width:0}
.day i{font-style:normal;font-size:10px;color:var(--ink-3)}
.day b{font-size:clamp(10px,2.9vw,13px);font-weight:600;color:#fff;text-align:center;line-height:1}
.day.has i{color:rgba(255,255,255,.85)}
.day.has:hover,.day.has:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.day.off{visibility:hidden}

/* list */
.list{overflow:hidden}
.lr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--faint);text-align:left;width:100%}
.lr:first-child{border-top:0}
.lr:hover{background:var(--paper-2)}
.res{font-weight:700;font-size:13px}
.res.W{color:var(--win)}.res.L{color:var(--loss)}.res.P{color:var(--push)}
.lr .p{font-weight:500;font-size:16px}
.lr .m{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.lr .uu{font-weight:500;font-size:15px}
.late{display:inline-block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.more{display:block;width:100%;padding:14px;border-top:1px solid var(--rule);font-size:14px;color:var(--sky-deep)}

/* day sheet */
.scrim{position:fixed;inset:0;background:rgba(13,27,42,.4);opacity:0;pointer-events:none;transition:opacity .18s;z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:18px 16px 28px;transform:translateY(105%);transition:transform .22s ease}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
@media(min-width:820px){.sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;transform:translateX(105%)}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh h3{font-weight:300;font-size:26px}
.snav{display:flex;gap:6px}
.snav button{border:1px solid var(--rule);background:#fff;border-radius:3px;width:38px;height:38px}
.dtot{display:flex;gap:14px;align-items:baseline;padding:14px 0;margin:12px 0;border-top:3px double var(--ink);border-bottom:1px solid var(--rule)}
.dtot b{font-weight:200;font-size:46px;letter-spacing:-1px;line-height:1}
.dtot span{color:var(--ink-2);font-size:14px}
.pk{background:#fff;border:1px solid var(--rule);border-radius:6px;margin-bottom:10px;overflow:hidden}
.pk .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px}
.pk .pick{font-weight:400;font-size:24px;letter-spacing:-.3px}
.pk .pick small{font-size:13px;color:var(--ink-3)}
.pk .mu{font-size:13px;color:var(--ink-2);margin-top:3px}
.pk .rr{text-align:right}
.pk .rr b{display:block;font-weight:600;font-size:13px;letter-spacing:1px}
.pk .rr span{display:block;font-weight:300;font-size:24px;margin-top:2px}
.pk dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:10px 16px 14px;border-top:1px solid var(--faint);font-size:13px}
.pk dt{color:var(--ink-3)}
.pk dd{text-align:right}
footer{margin-top:26px;font-size:12px;color:var(--ink-2);line-height:1.6;border-top:1px solid var(--rule);padding-top:16px}
footer a{color:var(--sky-deep)}
</style>
</head>
<body>
<header class="sky">
  <div class="bar"><a class="brand" href="/"><img src="/favicon.svg" alt="">MORELLO SIMS</a>
    <nav class="nav"><a href="/">Picks</a><a href="/nbasim/">Data</a><a class="on" href="/ledger/nba/">Ledger</a></nav></div>
  <div class="head"><h1>The ledger</h1><p id="kick">NBA · every pick, losses included</p><div class="seasons" id="seasons"></div></div>
</header>

<main>
  <section class="card summary">
    <div class="views" id="views" role="group" aria-label="Which picks">
      <button data-v="all">Every<br>pick</button><button data-v="before">Logged<br>before tip</button><button data-v="spreads">Spreads<br>before tip</button>
    </div>
    <div class="big"><div class="u" id="units">—</div>
      <div class="stats"><div><b id="rec">—</b><span>record</span></div><div><b id="roi">—</b><span>roi</span></div><div><b id="n">—</b><span>picks</span></div></div></div>
    <p class="what" id="what"></p>
    <div class="facts" id="facts"></div>
  </section>

  <section class="sec"><div class="label"><span>Running units</span><span>tap a point</span></div>
    <div class="card chart"><svg id="chart" role="img" aria-label="Running units by day"></svg><div class="tip" id="tip"></div></div></section>

  <section class="sec"><div class="label"><span>Every day</span><span>tap a day</span></div>
    <div class="mtabs" id="tabs"></div><div class="months" id="months"></div></section>

  <section class="sec"><div class="label"><span>Every pick</span><span id="listk"></span></div>
    <div class="card list" id="list"></div></section>

  <footer id="note"></footer>
</main>

<div id="sheetwrap">
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sht">
    <div class="sh"><h3 id="sht">—</h3>
      <div class="snav"><button id="prev" aria-label="Previous pick day">‹</button><button id="next" aria-label="Next pick day">›</button><button id="close" aria-label="Close">✕</button></div></div>
    <div class="dtot"><b id="dtot">—</b><span id="drec"></span></div>
    <div id="dpicks"></div>
  </aside>
</div>

<script>
const fmtU = (v, d = 1) => (Math.abs(v) < 0.05 && d === 1 ? "0.0" : (v > 0 ? "+" : "−") + Math.abs(v).toFixed(d)) + "u";
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const VIEWS = {
  all:     {f: () => true, what: "Every graded pick from the season, wins and losses."},
  before:  {f: p => !p.late, what: "Only picks with a pregame timestamp on record."},
  spreads: {f: p => !p.late && p.type === "spread", what: "Spreads with a pregame timestamp on record."},
};
let D, P, byDay, days, sel = null, month = "ALL", view = "all", showAll = false;

const SEASON = new URLSearchParams(location.search).get("s") || "__SEASON__";
fetch("seasons.json").then(r => r.json()).then(list => { if (list.length > 1)
  document.getElementById("seasons").innerHTML = list.slice().reverse().map(s => `<a href="?s=${s}" aria-current="${s === SEASON}">${s}</a>`).join(""); }).catch(() => {});
fetch(SEASON + ".json").then(r => r.json()).then(d => { D = d; document.title = `NBA Ledger ${d.season} · Morello Sims`;
  document.getElementById("kick").textContent = `NBA ${d.season} · every pick, losses included`;
  const v = new URLSearchParams(location.search).get("view"); if (VIEWS[v]) view = v;
  document.querySelectorAll("#views button").forEach(b => b.onclick = () => { view = b.dataset.v; month = "ALL"; init(); });
  document.getElementById("scrim").onclick = closeDay; document.getElementById("close").onclick = closeDay;
  document.getElementById("prev").onclick = () => step(-1); document.getElementById("next").onclick = () => step(1);
  document.addEventListener("keydown", e => { if (!sel) return; if (e.key === "Escape") closeDay(); if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
  init();
  const h = location.hash.match(/^#(\d{4}-\d{2}-\d{2})$/); if (h) openDay(h[1]);
});

function rec(ps) { const w = ps.filter(p => p.result === "W").length, l = ps.filter(p => p.result === "L").length, pu = ps.length - w - l; return `${w}-${l}${pu ? "-" + pu : ""}`; }
function init() {
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view));
  P = D.picks.filter(VIEWS[view].f);
  byDay = {}; P.forEach(p => (byDay[p.date] = byDay[p.date] || []).push(p));
  days = Object.keys(byDay).sort();
  const tot = d => byDay[d].reduce((a, p) => a + p.units, 0);
  const units = P.reduce((a, p) => a + p.units, 0), risked = P.filter(p => p.result !== "P").reduce((a, p) => a + p.stake_u, 0);
  const u = document.getElementById("units"); u.textContent = fmtU(units); u.className = "u " + cls(units);
  document.getElementById("rec").textContent = rec(P);
  document.getElementById("roi").textContent = (units >= 0 ? "+" : "−") + Math.abs(risked ? 100 * units / risked : 0).toFixed(1) + "%";
  document.getElementById("n").textContent = P.length;
  document.getElementById("what").innerHTML = VIEWS[view].what;
  const months = [...new Set(days.map(d => d.slice(0, 7)))];
  const mt = m => days.filter(d => d.startsWith(m)).reduce((a, d) => a + tot(d), 0);
  const mname = m => new Date(m + "-15").toLocaleString("en-US", {month: "short"});
  if (days.length) {
    const best = days.reduce((a, b) => tot(b) > tot(a) ? b : a), worst = days.reduce((a, b) => tot(b) < tot(a) ? b : a);
    const bestM = months.reduce((a, b) => mt(b) > mt(a) ? b : a);
    const up = days.filter(d => tot(d) > 0).length, down = days.filter(d => tot(d) < 0).length;
    document.getElementById("facts").innerHTML = [
      [fmtU(tot(best), 2), `best day · ${pretty(best, true)}`, `day:${best}`],
      [fmtU(tot(worst), 2), `worst day · ${pretty(worst, true)}`, `day:${worst}`],
      [fmtU(mt(bestM)), `best month · ${mname(bestM)}`, `month:${bestM}`],
      [`${up} / ${down}`, `up days / down days`, `month:ALL`],
    ].map(([b, s, a]) => `<button class="fact" data-a="${a}"><b>${b}</b><span>${s}</span></button>`).join("");
    document.querySelectorAll(".fact").forEach(el => el.onclick = () => { const [k, v] = el.dataset.a.split(":");
      if (k === "day") openDay(v); else { setMonth(v); document.getElementById("months").scrollIntoView({behavior: "smooth", block: "start"}); } });
  }
  document.getElementById("tabs").innerHTML = ["ALL", ...months].map(m =>
    `<button class="mtab" data-m="${m}" aria-pressed="${m === month}">${m === "ALL" ? "All" : mname(m) + " " + fmtU(mt(m))}</button>`).join("");
  document.querySelectorAll(".mtab").forEach(el => el.onclick = () => setMonth(el.dataset.m));
  const late = D.picks.filter(p => p.late).length;
  document.getElementById("note").innerHTML = `1u = one standard bet (${D.unit_pp} $PP). Spreads graded at the posted price, −110 unless another price was logged. ` +
    `Only finished games appear. Picks without a pregame timestamp are marked on their day. ` +
    `Before ${pretty(D.summary.first)} the season was tracked as totals only, so those days aren't itemized. Updated ${D.generated}. ` +
    `<a href="/archive/">Archive</a>`;
  render(); chart();
  if (sel && !byDay[sel]) closeDay();
}
function pretty(d, short) { const x = new Date(d + "T12:00:00"); return x.toLocaleDateString("en-US", short ? {month: "short", day: "numeric"} : {weekday: "short", month: "short", day: "numeric"}); }
function color(v) { if (Math.abs(v) < 0.05) return "var(--push)"; const a = Math.min(1, .38 + Math.abs(v) / 3 * .62);
  return v > 0 ? `rgba(15,138,67,${a})` : `rgba(176,32,30,${a})`; }
function setMonth(m) { month = m; showAll = false; document.querySelectorAll(".mtab").forEach(t => t.setAttribute("aria-pressed", t.dataset.m === m)); render(); }
function render() {
  const ms = [...new Set(days.map(d => d.slice(0, 7)))].filter(m => month === "ALL" || m === month);
  const dt = d => byDay[d] ? byDay[d].reduce((a, p) => a + p.units, 0) : null;
  document.getElementById("months").innerHTML = ms.map(m => {
    const [y, mo] = m.split("-").map(Number), first = new Date(y, mo - 1, 1).getDay(), n = new Date(y, mo, 0).getDate();
    const mtot = days.filter(d => d.startsWith(m)).reduce((a, d) => a + dt(d), 0);
    let cells = ""; for (let i = 0; i < first; i++) cells += `<span class="day off"></span>`;
    for (let i = 1; i <= n; i++) { const d = `${m}-${String(i).padStart(2, "0")}`, v = dt(d);
      cells += v === null ? `<span class="day"><i>${i}</i></span>`
        : `<button class="day has${sel === d ? " sel" : ""}" data-d="${d}" style="background:${color(v)}" aria-label="${pretty(d)}: ${fmtU(v)}"><i>${i}</i><b>${fmtU(v).replace("u", "")}</b></button>`; }
    return `<div class="card month"><div class="mh"><b>${new Date(y, mo - 1, 1).toLocaleString("en-US", {month: "long"})}</b><span class="${cls(mtot)}">${fmtU(mtot)}</span></div>
      <div class="dow">${"SMTWTFS".split("").map(c => `<span>${c}</span>`).join("")}</div><div class="grid">${cells}</div></div>`; }).join("");
  document.querySelectorAll(".day.has").forEach(b => b.onclick = () => openDay(b.dataset.d));
  const ps = P.filter(p => month === "ALL" || p.date.startsWith(month)).slice().reverse();
  const shown = showAll ? ps : ps.slice(0, 40);
  document.getElementById("listk").textContent = `${ps.length} picks`;
  document.getElementById("list").innerHTML = shown.map(p => `<button class="lr" data-d="${p.date}"><span class="res ${p.result}">${p.result}</span>
    <span><span class="p">${p.pick.replace(/ -(?=\d)/, " −")}</span>${p.late ? `<span class="late">logged late</span>` : ""}<span class="m">${p.away} @ ${p.home} · ${pretty(p.date, true)} · ${p.final || ""}</span></span>
    <span class="uu ${cls(p.units)}">${fmtU(p.units, 2)}</span></button>`).join("")
    + (ps.length > shown.length ? `<button class="more" id="more">Show all ${ps.length} picks</button>` : "");
  document.querySelectorAll(".lr").forEach(b => b.onclick = () => openDay(b.dataset.d));
  const more = document.getElementById("more"); if (more) more.onclick = () => { showAll = true; render(); };
}
function chart() {
  const svg = document.getElementById("chart"), W = svg.clientWidth || 700, H = 220, pad = 26;
  if (!days.length) { svg.innerHTML = ""; return; }
  let run = 0; const pts = days.map(d => { run += byDay[d].reduce((a, p) => a + p.units, 0); return {d, v: run}; });
  const xs = i => pad + i * (W - 2 * pad) / Math.max(1, pts.length - 1);
  const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
  const ys = v => H - pad - (v - lo) * (H - 2 * pad) / ((hi - lo) || 1);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p.v).toFixed(1)}`).join("");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<line x1="${pad}" x2="${W - pad}" y1="${ys(0)}" y2="${ys(0)}" stroke="#DED5CA" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${path} L${xs(pts.length - 1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="rgba(49,135,220,.08)"/>
    <path d="${path}" fill="none" stroke="#14202E" stroke-width="1.8" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${xs(i)}" cy="${ys(p.v)}" r="13" fill="transparent" data-i="${i}" style="cursor:pointer"/>`).join("")}
    <circle cx="${xs(pts.length - 1)}" cy="${ys(pts.at(-1).v)}" r="3.5" fill="#3187DC"/>
    <text x="${W - pad}" y="${ys(pts.at(-1).v) - 12}" text-anchor="end" font-family="Inter" font-weight="600" font-size="14" fill="#14202E">${fmtU(pts.at(-1).v)}</text>`;
  const tip = document.getElementById("tip");
  svg.querySelectorAll("circle[data-i]").forEach(c => { const p = pts[+c.dataset.i];
    const show = () => { const r = svg.getBoundingClientRect(), k = r.width / W; tip.style.left = (c.cx.baseVal.value * k + 10) + "px"; tip.style.top = (c.cy.baseVal.value * k + 14) + "px";
      tip.textContent = `${pretty(p.d, true)} · ${fmtU(p.v)} running`; tip.style.opacity = 1; };
    c.onmouseenter = show; c.onmouseleave = () => tip.style.opacity = 0; c.onclick = () => openDay(p.d); });
}
function openDay(d) {
  if (!byDay[d]) { view = "all"; init(); if (!byDay[d]) return; }   // a late-only day: show it under Everything
  sel = d; const ps = byDay[d], t = ps.reduce((a, p) => a + p.units, 0);
  document.getElementById("sht").textContent = pretty(d);
  const dt = document.getElementById("dtot"); dt.textContent = fmtU(t, 2); dt.className = cls(t);
  document.getElementById("drec").textContent = `${rec(ps)} · ${ps.length} pick${ps.length > 1 ? "s" : ""}`;
  document.getElementById("dpicks").innerHTML = ps.map(p => {
    const side = p.pick.split(" ")[0], team = (D.teams[side] || {});
    const word = p.result === "W" ? "WIN" : p.result === "L" ? "LOSS" : "PUSH";
    return `<div class="pk"><div class="t1"><div><div class="pick">${p.pick.replace(/ -(?=\d)/, " −")} <small>${p.odds || ""}</small></div>
        <div class="mu">${p.away} @ ${p.home} · final ${p.final || "—"}</div></div>
        <div class="rr"><b class="res ${p.result}">${word}</b><span class="${cls(p.units)}">${fmtU(p.units, 2)}</span></div></div>
      <dl>${p.sim_margin != null ? `<dt>The sim</dt><dd>${team.name || side} ${p.sim_margin >= 0 ? "by" : "losing by"} ${Math.abs(p.sim_margin).toFixed(1)}</dd>` : ""}
        ${p.edge != null ? `<dt>Edge vs line</dt><dd>${(+p.edge).toFixed(1)} pts</dd>` : ""}
        <dt>Stake</dt><dd>${p.stake_u}u</dd>
        <dt>Logged</dt><dd>${p.logged || "—"}${p.late ? `<span class="late">logged late</span>` : " · before tip"}</dd></dl></div>`; }).join("");
  document.getElementById("sheetwrap").className = "open";
  history.replaceState(null, "", location.search + "#" + d); render();
}
function closeDay() { sel = null; document.getElementById("sheetwrap").className = ""; history.replaceState(null, "", location.pathname + location.search); render(); }
function step(k) { const i = days.indexOf(sel) + k; if (i >= 0 && i < days.length) openDay(days[i]); }
