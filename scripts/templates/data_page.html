<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Data · Morello Sims</title>
<meta name="description" content="Tonight's NBA slate: lines, team ratings and rotations for every game. The sim's number opens at tip.">
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300&display=swap" rel="stylesheet">
<style>
:root{--sky:#3187DC;--sky-deep:#1F66B4;--paper:#F5F0ED;--paper-2:#FBF8F5;--ink:#14202E;--ink-2:#4B5868;--ink-3:#8A93A0;--rule:#DED5CA;--gold:#B9861B;--gold-soft:#F3E6C4;--green:#0F8A43;--red:#B0201E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* header: the poster sky */
.sky{background:var(--sky);color:#fff;padding:0 16px 34px}
.bar{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:2px;font-size:12px;text-decoration:none}
.brand img{width:22px;height:22px}
.nav{display:flex;gap:18px;font-style:italic;font-weight:300;font-size:14px}
.nav a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.55)}
.nav a.on{border-color:#fff;font-weight:400}
.head{max-width:1120px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.head h1{font-weight:200;font-size:clamp(44px,11vw,88px);letter-spacing:-2px;line-height:.92}
.head p{font-style:italic;font-weight:300;font-size:15px;margin-top:10px;opacity:.95}
.dates{display:flex;gap:6px}
.dates button{width:40px;height:40px;border:1px solid rgba(255,255,255,.7);border-radius:3px;display:grid;place-items:center}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media(min-width:900px){.wrap{grid-template-columns:340px minmax(0,1fr);align-items:start}.slate{position:sticky;top:20px}}
.label{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3)}

/* slate */
.slate{margin-top:-18px;background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.slate .label{padding:14px 16px 10px;display:flex;justify-content:space-between}
.g{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border-top:1px solid var(--rule);text-align:left;width:100%;position:relative}
.g:hover{background:var(--paper-2)}
.g[aria-current="true"]{background:var(--paper-2)}
.g[aria-current="true"]:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sky)}
.g .teams{font-weight:500;font-size:16px;line-height:1.35}
.g .teams span{color:var(--ink-3);font-weight:400}
.g .time{font-size:13px;color:var(--ink-2);text-align:right}
.g .line{font-size:13px;color:var(--ink-2)}
.g .seal{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--gold);text-transform:uppercase;text-align:right;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.g .seal i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.g .seal.live{color:var(--red)}.g .seal.live i{background:var(--red)}
.g .seal.final{color:var(--ink-2)}.g .seal.final i{display:none}
.cells .open{background:#EEF5FD}.cells .open b{font-size:clamp(19px,5vw,26px);font-weight:300;color:var(--ink);margin-top:6px}.cells .open p{font-size:12px;color:var(--ink-2);margin-top:4px}
.empty{padding:40px 22px;text-align:center;color:var(--ink-2);font-style:italic;font-weight:300}
.on-board{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;border:1px solid var(--rule);border-radius:3px;padding:6px 10px}

/* the report */
.report{background:#fff;border:1px solid var(--rule);border-radius:6px;margin-top:0;position:relative}
@media(min-width:900px){.report{margin-top:-18px}}
.rh{display:flex;justify-content:space-between;align-items:baseline;padding:16px 22px 12px;border-bottom:3px double var(--ink)}
.rh b{font-size:12px;font-weight:700;letter-spacing:3px}
.rh span{font-size:12px;color:var(--ink-2);letter-spacing:1px}
.sec{padding:22px;border-top:1px solid var(--rule)}
.sec:first-of-type{border-top:0}
.title h2{font-weight:200;font-size:clamp(34px,7vw,52px);letter-spacing:-1px;line-height:1}
.title h2 em{font-style:italic;font-weight:200;color:var(--ink-2)}
.title p{margin-top:8px;color:var(--ink-2);font-size:14px}

.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:4px;margin-top:12px}
.cells div{padding:14px 14px 12px;border-left:1px solid var(--rule)}
.cells div:first-child{border-left:0}
.cells small{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cells b{display:block;white-space:nowrap;font-weight:300;font-size:clamp(19px,5vw,30px);margin-top:6px;letter-spacing:-.5px}
.cells .sealed{background:var(--gold-soft)}
.cells .sealed b{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.5px;margin-top:10px}
.cells .sealed p{font-size:12px;color:#7A5A12;margin-top:4px}

/* ratings: diverging bars */
.cmp{margin-top:12px}
.cmp .hd{display:grid;grid-template-columns:1fr 120px 1fr;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--rule)}
.cmp .hd span:last-child{text-align:right}
.cmp .r{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;padding:10px 0;border-bottom:1px solid #EFE8E0}
.cmp .r:last-child{border-bottom:0}
.cmp .side{display:flex;align-items:center;gap:10px}
.cmp .side.right{flex-direction:row-reverse}
.cmp .v{font-size:15px;min-width:52px}
.cmp .side.right .v{text-align:right}
.cmp .v.best{font-weight:600}
.cmp .track{flex:1;height:2px;background:#EFE8E0;position:relative}
.cmp .track i{position:absolute;top:-1px;height:4px;background:var(--ink);border-radius:2px}
.cmp .side.left .track i{right:0}.cmp .side.right .track i{left:0}
.cmp .track i.lo{background:#C9C1B6}
.cmp .mid{text-align:center;font-size:12px;color:var(--ink-3);letter-spacing:.5px}

/* rotation */
.rot{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:12px}
@media(min-width:640px){.rot{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rot h4{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--rule)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #EFE8E0;font-size:14px}
.pl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .m{color:var(--ink-3);font-size:12px;text-align:right}
.pl .s{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pl .s b{font-weight:600;width:22px;text-align:right}
.pl .s i{display:block;width:32px;height:2px;background:#EFE8E0;position:relative}
.pl .s i u{position:absolute;left:0;top:-1px;height:4px;border-radius:2px;background:var(--sky)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border-top:3px double var(--ink);font-size:12px;color:var(--ink-2)}
.stamp{flex:none;width:76px;height:76px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;letter-spacing:1.2px;line-height:1.35;transform:rotate(-10deg)}
.note{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:10px}
.cta{display:inline-block;margin-top:14px;background:var(--sky);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 18px;border-radius:4px}
.what{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.5}
.subnav{display:flex;gap:16px;font-size:13px;font-weight:500;letter-spacing:.3px;margin-bottom:14px}
.subnav a{text-decoration:none;opacity:.75;padding-bottom:3px;border-bottom:1px solid transparent}
.subnav a.on{opacity:1;border-color:#fff}
@media(max-width:400px){.brand span{display:none}}
.brand{font-family:"Instrument Serif",Georgia,serif;font-size:27px;font-weight:400;letter-spacing:-.3px;text-transform:none;white-space:nowrap}
</style></head>
<body>

<header class="sky">
  <div class="bar"><a class="brand" href="/">Morello Sims</a>
    <nav class="nav"><a class="on" href="/">NBA</a><a href="/nfl/">NFL</a><a href="/extra/">Extra</a></nav></div>
  <div class="head"><div><div class="subnav"><a href="/">Picks</a><a class="on" href="/nbasim/">Data</a><a href="/ledger/nba/">Ledger</a></div><h1 id="h1">Tonight</h1><p id="sub">—</p></div>
  </div>
</header>

<main class="wrap">
  <aside class="slate" id="slate"></aside>
  <article class="report" id="report"></article>
</main>

<script>
const ET = {timeZone: "America/New_York"};
const tip = iso => new Date(iso).toLocaleTimeString("en-US", {...ET, hour: "numeric", minute: "2-digit"});
const dayL = iso => new Date(iso).toLocaleDateString("en-US", {...ET, weekday: "short", month: "short", day: "numeric"});
const mn = s => String(s ?? "").replace(/(\s|^)-(?=\d)/g, "$1−");
const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
let D, cur = 0;
const nick = ab => (D.teams[ab] || {}).nick || ab;

const ROWS = [ // label, key, format, higher-is-better
  ["Offense", "off_rating", v => v.toFixed(1), true],
  ["Defense", "def_rating", v => v.toFixed(1), false],
  ["Net", "net_rating", v => (v >= 0 ? "+" : "") + v.toFixed(1), true],
  ["Pace", "pace", v => v.toFixed(1), null],
  ["3-pt rate", "fg3a_rate", v => (v * 100).toFixed(0) + "%", null],
  ["Turnovers", "tov_pct", v => (v * 100).toFixed(1) + "%", false],
];

function status(g) {
  if (g.state === "post") return `<span class="seal final">Final ${g.away_score}–${g.home_score}</span>`;
  if (g.state === "in") return `<span class="seal live"><i></i>Live</span>`;
  return `<span class="seal"><i></i>Sealed</span>`;
}
function simCell(g) {
  if (!g.sim) return `<div class="sealed"><small>The sim</small><b>SEALED</b><p>Opens at tip, ${tip(g.tip)}</p></div>`;
  return `<div class="open"><small>The sim</small><b>${g.home} ${sgn(g.sim.spread_home)}</b><p>total ${g.sim.total ?? "—"}</p></div>`;
}
function report(i) {
  cur = i;
  const g = D.games[i], A = D.teams[g.away], H = D.teams[g.home];
  const have = A && H && A.stats && H.stats;
  const rows = !have ? "" : ROWS.map(([lab, k, fmt, hib]) => {
    const va = A.stats[k], vh = H.stats[k], all = Object.values(D.teams).filter(t => t.stats).map(t => t.stats[k]);
    const lo = Math.min(...all), hi = Math.max(...all), w = v => 18 + (v - lo) / ((hi - lo) || 1) * 82;
    const ba = hib === null ? false : hib ? va > vh : va < vh, bh = hib === null ? false : !ba && va !== vh;
    return `<div class="r"><div class="side left"><span class="v ${ba ? "best" : ""}">${fmt(va)}</span><span class="track"><i class="${ba || hib === null ? "" : "lo"}" style="width:${w(va)}%"></i></span></div>
      <div class="mid">${lab}</div>
      <div class="side right"><span class="v ${bh ? "best" : ""}">${fmt(vh)}</span><span class="track"><i class="${bh || hib === null ? "" : "lo"}" style="width:${w(vh)}%"></i></span></div></div>`;
  }).join("");
  const rot = t => `<div><h4>${t.name}</h4>${t.players.map(p => `<div class="pl"><span class="n">${p.name}</span><span class="m">${(+p.mpg).toFixed(1)} min</span>
    <span class="s"><b>${p.rating}</b><i><u style="width:${Math.max(0, (p.rating - 40) / 59 * 100)}%"></u></i></span></div>`).join("")}</div>`;
  const no = new Date(g.tip).toLocaleDateString("en-CA", ET).replaceAll("-", "") + "-" + String(i + 1).padStart(2, "0");
  const after = g.state !== "pre" || g.sim;
  document.getElementById("report").innerHTML = `
    <div class="rh"><b>GAME REPORT</b><span>No. ${no}</span></div>
    <section class="sec title"><h2>${nick(g.away)} <em>at</em> ${nick(g.home)}</h2>
      <p>${dayL(g.tip)} · ${tip(g.tip)} ET${g.venue ? " · " + g.venue : ""}${g.state === "post" ? ` · Final ${g.away} ${g.away_score}, ${g.home} ${g.home_score}` : ""}</p>
      <div class="cells"><div><small>Spread</small><b>${mn(g.line) || "—"}</b></div><div><small>Total</small><b>${g.total ?? "—"}</b></div>${simCell(g)}</div>
      ${g.pick ? `<span class="on-board">On the board: ${mn(g.pick.text)}${g.pick.status && g.pick.status !== "pending" ? " · " + g.pick.status.toUpperCase() : ""}</span>` : ""}
      <p class="what">Lines from ESPN. The sim's number is the pick, so it stays sealed until tip. After tip it's shown here and graded on the <a href="/ledger/nba/">ledger</a>.</p></section>
    ${have ? `<section class="sec"><div class="label">Team ratings · ${D.ratings_label}</div>
      <div class="cmp"><div class="hd"><span>${g.away}</span><span></span><span>${g.home}</span></div>${rows}</div>
      <p class="what">Per 100 possessions. Bold is the better side. Bars are scaled across tonight's teams.</p></section>` : ""}
    ${A && H ? `<section class="sec"><div class="label">Rotation · player rating 0–99</div>
      <div class="rot">${rot(A)}${rot(H)}</div>
      <p class="what">Top five by minutes. Ratings as of ${new Date(D.snap + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"})}; they update after every game.</p></section>` : ""}
    ${after ? "" : `<section class="sec"><div class="label">Members</div>
      <p class="note">The sim's spread and total for this game, and whether it's on tonight's board, go out the moment the board drops.</p>
      <a class="cta" href="/#join">Get tonight's picks</a></section>`}
    <div class="foot"><span>Every game gets a report. After tip it shows the sim's number and the final, and it's never edited.</span><div class="stamp">GRADED<br>IN<br>PUBLIC</div></div>`;
  document.querySelectorAll(".g").forEach((el, j) => el.setAttribute("aria-current", j === i));
  history.replaceState(null, "", "#" + (i + 1));
}

fetch("slate.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  D = d;
  document.getElementById("h1").textContent = d.title;
  const n = d.games.length;
  document.getElementById("sub").textContent = n ? `${dayL(d.games[0].tip)} · ${n} game${n > 1 ? "s" : ""}` : "No games this week";
  if (!n) { document.getElementById("slate").innerHTML = `<div class="empty">No games on the schedule this week.</div>`; document.getElementById("report").style.display = "none"; return; }
  document.getElementById("slate").innerHTML = `<div class="label"><span>${d.title === "Tonight" ? "Tonight" : "The slate"}</span><span>${n} games</span></div>` +
    d.games.map((g, i) => `<button class="g" data-i="${i}"><span class="teams">${nick(g.away)}<br><span>at</span> ${nick(g.home)}</span>
      <span class="time">${tip(g.tip)}</span><span class="line">${mn(g.line) || "line soon"}${g.total ? " · O/U " + g.total : ""}</span>${status(g)}</button>`).join("");
  document.querySelectorAll(".g").forEach(el => el.addEventListener("click", () => { report(+el.dataset.i); if (innerWidth < 900) document.getElementById("report").scrollIntoView({behavior: "smooth"}); }));
  const h = +(location.hash.slice(1)) - 1;
  report(h >= 0 && h < n ? h : 0);
});
</script>
</body></html>
