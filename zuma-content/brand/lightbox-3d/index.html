<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZUMA Lightbox Live</title>
<style>
  :root{--ink:#16181C;--snow:#FCFBF8}
  html,body{margin:0;height:100%;background:#0b0c0d;overflow:hidden;font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .src{position:fixed;inset:0;width:100vw;height:100vh;opacity:0;pointer-events:none;z-index:-1}
  .ui{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:none}
  .ui button{pointer-events:auto;border:0;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink);background:rgba(252,251,248,.85);backdrop-filter:blur(8px);cursor:pointer}
  .ui button[aria-pressed="true"]{background:var(--ink);color:var(--snow)}
</style></head>
<body>
<!-- The site's own Lightbox (ombre.js, same settings as the site's canvases), one per research colour. Painted once, then shown through the glass below. -->
<canvas class="src" data-lb="tissue"    data-seed="14" data-cols="3" data-rows="4" data-behind="palm" data-bseed="6"></canvas>
<canvas class="src" data-lb="metabolic" data-seed="13" data-cols="3" data-rows="4" data-behind="palm" data-bseed="22"></canvas>
<canvas class="src" data-lb="dermal"    data-seed="11" data-cols="3" data-rows="4" data-behind="palm" data-bseed="4"></canvas>
<canvas class="src" data-lb="endocrine" data-seed="5"  data-cols="3" data-rows="4" data-behind="palm" data-bseed="20"></canvas>
<canvas class="src" data-lb="neuro"     data-seed="21" data-cols="3" data-rows="4" data-behind="palm" data-bseed="8"></canvas>
<canvas class="src" data-lb="supplies"  data-seed="34" data-cols="3" data-rows="4" data-behind="palm" data-bseed="24"></canvas>
<canvas id="gl"></canvas>
<div class="ui" id="ui"></div>
<script src="ombre.js"></script>
<script>
// Motion on top of the real Lightbox: a gentle shimmer in the glass, a slow drift, and a soft pool of light that follows the pointer or finger.
const NAMES = { tissue: 'Tissue', metabolic: 'Metabolic', dermal: 'Dermal', endocrine: 'Endocrine', neuro: 'Neuro', supplies: 'ZUMA grey' };
const Q = new URLSearchParams(location.search);
let area = Q.get('area') || 'tissue'; if (area === 'zuma') area = 'supplies'; if (!NAMES[area]) area = 'tissue';
const src = k => document.querySelector(`canvas.src[data-lb="${k}"]`);
const cv = document.getElementById('gl'), gl = cv.getContext('webgl', { antialias: false });
const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS = `precision highp float;varying vec2 uv;uniform sampler2D lb;uniform vec2 res;uniform float t;uniform vec2 light;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 g2(vec2 p){float a=h21(p)*6.2831853;return vec2(cos(a),sin(a));}
float gn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  return .5+.5*mix(mix(dot(g2(i),f),dot(g2(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(g2(i+vec2(0,1)),f-vec2(0,1)),dot(g2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}
const mat2 R=mat2(.8,.6,-.6,.8);
float glass(vec2 p){return gn(R*p*22.+vec2(t*.05,0.))*.7+gn(R*R*p*9.-vec2(0.,t*.03))*.3;}   // a slow, soft ripple in the glass
void main(){
  vec2 asp=vec2(res.x/res.y,1.); vec2 p=uv*asp;
  float e=.002, h=glass(p); vec2 n=vec2(h-glass(p+vec2(e,0.)),h-glass(p+vec2(0.,e)))/e;
  vec2 drift=vec2(sin(t*.11),cos(t*.09))*.004;                        // the whole field breathes a little
  vec2 su=uv+n*.00012+drift;   // a shimmer of a pixel or two, never a warp su=clamp(su,.002,.998);
  vec3 col=texture2D(lb,vec2(su.x,1.-su.y)).rgb;
  float ld=distance(uv*asp,light*asp);
  float pool=exp(-ld*ld*4.); col=1.-(1.-col)*(1.-vec3(.30)*pool);      // screen-blend a soft light pool: brightens, never washes out
  col+=vec3(.05)*smoothstep(.62,.9,h)*pool;                           // a faint glint on the ripple, only where the light is
  col*=1.-.10*pow(length(uv-.5)*1.3,2.);                              // the lightest vignette
  gl_FragColor=vec4(col,1.);}`;
function sh(type, s) { const o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const pl = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
function upload() { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src(area)); }
const uRes = gl.getUniformLocation(pr, 'res'), uT = gl.getUniformLocation(pr, 't'), uL = gl.getUniformLocation(pr, 'light');
let L = [0.3, 0.75], LT = [0.3, 0.75];
const move = e => { const pt = e.touches ? e.touches[0] : e; LT = [pt.clientX / innerWidth, 1 - pt.clientY / innerHeight]; };
addEventListener('pointermove', move); addEventListener('touchmove', move, { passive: true });
function resize() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; gl.viewport(0, 0, cv.width, cv.height); setTimeout(upload, 300); }
addEventListener('resize', resize);
const still = Q.has('t'), T0 = +(Q.get('t') || 0), calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ms) {
  const t = still || calm ? T0 : ms / 1000; L[0] += (LT[0] - L[0]) * 0.06; L[1] += (LT[1] - L[1]) * 0.06;
  if (!still) { LT[0] += Math.sin(t * 0.21) * 0.0007; LT[1] += Math.cos(t * 0.17) * 0.0005; }
  gl.uniform2f(uRes, cv.width, cv.height); gl.uniform1f(uT, t); gl.uniform2f(uL, L[0], L[1]); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  if (!still) requestAnimationFrame(frame);
}
const ui = document.getElementById('ui');
for (const k of Object.keys(NAMES)) { const b = document.createElement('button'); b.textContent = NAMES[k]; b.setAttribute('aria-pressed', String(k === area));
  b.onclick = () => { area = k; upload(); for (const x of ui.children) x.setAttribute('aria-pressed', String(x === b)); if (still) requestAnimationFrame(frame); }; ui.appendChild(b); }
addEventListener('load', () => { resize(); setTimeout(() => { upload(); requestAnimationFrame(frame); }, 400); });
</script>
</body></html>
