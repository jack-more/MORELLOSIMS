<!doctype html><meta charset="utf-8">
<!-- ZUMA bounce: one vial spins and hops on the beat; every landing turns it into the next of the eleven compounds with a squash, a
     flash, a flower-shaped shockwave in the new area colour, a colour flood from the impact point and petal confetti.
     After the last it bursts into the end card. render(t) is deterministic once prep(t) has loaded that moment's spin
     frame; shoot.cjs awaits prep(t) then render(t). 120 BPM, 15 s, 1080x1920 (9:16). -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// timed to the track: 115.99 BPM, a landing every two beats; ?bpm= overrides (the synth bed was 120)
const BPM = +(new URLSearchParams(location.search).get('bpm') || 115.99);
const W = 1080, H = 1920, BEAT = 60 / BPM, HOP = 2 * BEAT, T0 = HOP, DUR = T0 + 11 * HOP + 7 * BEAT;
const c = document.getElementById('c'), x = c.getContext('2d');
const AREA = { metabolic: ['#1F4FD8', '#A3CEFF', '#0B1F5C'], tissue: ['#0E9A5B', '#ABE9C3', '#0A3B26'], dermal: ['#FF5A1F', '#FFB7C5', '#9E1717'],
  endocrine: ['#D08000', '#FFE97A', '#5E3C00'], neuro: ['#6E3FD8', '#D9C8FF', '#2A1263'], supplies: ['#4E6077', '#D9E1EA', '#1B2533'] };
const AREA_NAME = { metabolic: 'METABOLIC RESEARCH', tissue: 'TISSUE RESEARCH', dermal: 'DERMAL RESEARCH', endocrine: 'ENDOCRINE RESEARCH', neuro: 'NEURO RESEARCH', supplies: 'LAB SUPPLIES' };
// the twelve, ordered so the colour changes on every landing
const SEQ_ALL = [['01', 'RT-3', 'metabolic'], ['09', 'BPC+TB', 'tissue'], ['05', 'GHK-Cu', 'dermal'], ['04', 'TESAMORELIN', 'endocrine'], ['11', 'SELANK', 'neuro'],
  ['02', 'TZ-2', 'metabolic'], ['10', 'GHK+BT', 'dermal'], ['07', 'CJC+IPA', 'endocrine'], ['12', 'SEMAX', 'neuro'], ['06', 'MOTS-c', 'metabolic'],
  ['08', 'NAD+', 'metabolic']];
// ?preview: only the five vials whose spin frames exist so far
const SEQ = location.search.includes('preview') ? SEQ_ALL.filter((v) => ['01', '09', '05', '04', '11'].includes(v[0])) : SEQ_ALL;
const N = SEQ.length, T_END = T0 + N * HOP;          // the last landing turns into the end card
const FLOOR = 1560, VH = 720, LIFT = 360, SPIN_FPS = 22;
const glow = document.createElement('canvas'), gx = glow.getContext('2d');   // the vial alone, for the white-hot glint
let LOCK, FLOWER, MARK, LW;
const FCX = 52.13, FCY = 54.81;
const img = (s) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });

async function load() {
  await Promise.all([new FontFace('Outfit', 'url(../pack/fonts/Outfit.woff2)', { weight: '100 900' }), new FontFace('Plex', 'url(../pack/fonts/IBMPlexMono-600.woff2)', { weight: '600' }),
    new FontFace('Figtree', 'url(../pack/fonts/Figtree.woff2)', { weight: '300 900' })].map(async (f) => document.fonts.add(await f.load())));
  const F = await (await fetch('final.json')).json(), FO = await (await fetch('flower_outer.json')).json();
  LOCK = new Path2D(F.lock); MARK = new Path2D(F.mark); FLOWER = new Path2D(FO.outer); LW = F.W;
  window.READY = true;
}
load();

// ---------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const back = (t) => { t = clamp(t); const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fill(col) { x.fillStyle = col; x.fillRect(0, 0, W, H); }
function flower(path, cx, cy, h, rot, style, rule = 'evenodd', lineW = 0) {
  x.save(); x.translate(cx, cy); x.rotate(rot); const k = h / 100; x.scale(k, k); x.translate(-FCX, -FCY);
  if (lineW) { x.lineWidth = lineW / k; x.lineJoin = 'round'; x.strokeStyle = style; x.stroke(path); } else { x.fillStyle = style; x.fill(path, rule); }
  x.restore();
}

// which vial, where in its hop, and which spin frame, at time t
function state(t) {
  if (t < T0) return { i: 0, tau: null, fall: t / T0, since: -1 };                // dropping in for the first landing
  const k = Math.floor((t - T0) / HOP);
  return { i: Math.min(k, N - 1), tau: (t - T0 - k * HOP) / HOP, since: t - T0 - k * HOP, k };
}
const frameOf = (i, t) => `${SEQ[i][0]}-${String(Math.floor(t * SPIN_FPS + i * 7) % 24).padStart(2, '0')}`;
const FR = new Map();
window.prep = async (t) => {
  if (t >= T_END) return;
  const key = frameOf(state(t).i, t);
  if (!FR.has(key)) FR.set(key, await img(`../cyc/out15/hspin/${key}.png`));
  if (FR.size > 60) FR.delete(FR.keys().next().value);
};

// ---------- the pieces
function shadow(h, col) {   // contact shadow shrinks as the vial rises
  const k = 1 - clamp(h / LIFT) * .6;
  x.save(); x.globalAlpha = .22 * k + .05; x.fillStyle = col; x.beginPath(); x.ellipse(W / 2, FLOOR + 24, 210 * k, 34 * k, 0, 0, Math.PI * 2); x.fill(); x.restore();
}
function vialAt(t, s) {
  const im = FR.get(frameOf(s.i, t)); if (!im) return;
  let lift, sq = 1;
  if (s.tau === null) lift = lerp(1500, 0, s.fall * s.fall);                         // falls in from above the frame
  else lift = 4 * LIFT * s.tau * (1 - s.tau);
  const land = s.tau === null ? 0 : Math.max(0, 1 - s.since / .16);                 // squash right after each landing
  sq = 1 - .2 * land * Math.sin(Math.PI * clamp(s.since / .16));
  const stretch = s.tau !== null && s.tau > .08 && s.tau < .92 ? 1 + .05 * Math.abs(1 - 2 * s.tau) : 1;
  const h = VH * sq * stretch, w = VH * im.width / im.height / Math.sqrt(sq * stretch);
  const by = FLOOR - lift;                                                           // bottom of the vial
  x.save(); x.translate(W / 2, by); x.drawImage(im, -w / 2, -h * .97, w, h);
  // the glint: the new vial arrives white-hot and cools in a tenth of a second (whitened on its own canvas, so only the vial glows)
  if (s.since >= 0 && s.since < .12 && s.k > 0) {
    glow.width = Math.ceil(w); glow.height = Math.ceil(h); gx.drawImage(im, 0, 0, w, h);
    gx.globalCompositeOperation = 'source-atop'; gx.fillStyle = '#fff'; gx.fillRect(0, 0, w, h); gx.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1 - s.since / .12; x.drawImage(glow, -w / 2, -h * .97);
  }
  x.restore();
  return lift;
}
function burst(t, s, colNew) {   // shockwave, flash and petals from the landing point
  if (s.tau === null || s.k === 0 && s.since > .5) return;
  const a = s.since, cx = W / 2, cy = FLOOR, mid = FLOOR - VH * .45;
  if (a < .55) {
    const r = ease(a / .55);
    x.save(); x.globalAlpha = 1 - r; flower(FLOWER, cx, mid, 300 + r * 1700, a * 1.6, colNew, 'nonzero', 26 * (1 - r) + 4); x.restore();
    x.save(); x.globalAlpha = (1 - r) * .7; flower(FLOWER, cx, mid, 200 + r * 1100, -a * 2.2, '#fff', 'nonzero', 14 * (1 - r) + 2); x.restore();
  }
  if (a < .1) { x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = (1 - a / .1) * .55; const g = x.createRadialGradient(cx, mid, 0, cx, mid, 900); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H); x.restore(); }
  if (a < .7) {                                                                       // petal confetti in the new area's tones
    const r = rng(s.k * 97 + 3), [b1, l1, d1] = AREA[SEQ[s.i][2]];
    for (let p = 0; p < 34; p++) {
      const ang = -Math.PI * (.08 + .84 * r()), sp = 900 + 1300 * r(), life = clamp(a / (.45 + .3 * r()));
      const px = cx + Math.cos(ang) * sp * a, py = cy - 120 + Math.sin(ang) * sp * a + 2400 * a * a;
      x.save(); x.globalAlpha = 1 - life; x.translate(px, py); x.rotate(r() * 6 + a * (8 * r() - 4)); x.fillStyle = [b1, l1, '#fff', d1][p % 4];
      x.beginPath(); x.ellipse(0, 0, 9 + 12 * r(), 22 + 16 * r(), 0, 0, Math.PI * 2); x.fill(); x.restore();
    }
  }
}
function title(t, s) {   // the compound name slams in at each landing, the area name under it
  if (s.tau === null) return;
  const [, name, area] = SEQ[s.i], a = s.since, k = back(a / .22), col = AREA[area][2];
  x.save(); x.translate(W / 2, 260); x.scale(lerp(1.5, 1, clamp(k)), lerp(1.5, 1, clamp(k))); x.globalAlpha = clamp(a / .08);
  x.font = '900 190px Outfit'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const fit = Math.min(1, (W - 120) / x.measureText(name).width); x.scale(fit, fit);
  x.transform(1, 0, -.12, 1, 0, 0); x.fillStyle = col; x.fillText(name, 0, 0); x.restore();
  x.save(); x.globalAlpha = clamp((a - .1) / .2); x.font = '600 34px Plex'; x.textAlign = 'center'; x.fillStyle = col; x.fillText(AREA_NAME[area], W / 2, 390); x.restore();
}
function byline(dark) {
  x.save(); x.fillStyle = dark ? '#F7F4EE' : '#111319'; x.globalAlpha = .9; x.textAlign = 'center';
  x.font = '600 22px Figtree'; x.fillText('FOR LABORATORY RESEARCH USE ONLY. NOT FOR HUMAN OR VETERINARY USE.', W / 2, H - 70); x.restore();
}
function endCard(t) {
  const a = t - T_END;
  fill('#0E1014');
  if (a < .6) { const r = ease(a / .6); x.save(); x.globalAlpha = 1 - r; flower(FLOWER, W / 2, FLOOR - 330, 300 + r * 2000, a * 1.4, AREA[SEQ[N - 1][2]][0], 'nonzero', 30 * (1 - r) + 4); x.restore(); }
  const k = back(a / .45), out = ease((a - .95) / .3);
  if (k > 0 && out < 1) {                                                     // the big mark spins in, one full turn, then hands over
    x.save(); x.globalAlpha = 1 - out; flower(MARK, W / 2, 840 - out * 60, 460 * k * (1 - .5 * out), ease(a / 1.0) * Math.PI * 2, '#F7F4EE'); x.restore();
  }
  if (a > .95) {
    const k2 = back((a - .95) / .4), lw = 820 * clamp(k2), sc = lw / LW;
    x.save(); x.translate(W / 2 - lw / 2, 790 - 50 * sc); x.scale(sc, sc); x.fillStyle = '#F7F4EE'; x.fill(LOCK, 'evenodd'); x.restore();
  }
  if (a > 1.5) { x.save(); x.globalAlpha = ease((a - 1.5) / .4); x.font = '800 78px Outfit'; x.textAlign = 'center'; x.fillStyle = '#F7F4EE'; x.fillText('Every lot tested.', W / 2, 1040); x.restore(); }
  if (a > 2.0) { x.save(); x.globalAlpha = ease((a - 2.0) / .4); x.font = '600 38px Plex'; x.textAlign = 'center'; x.fillStyle = '#C9C4B8'; x.fillText('zumatides.com', W / 2, 1130); x.restore(); }
  if (a < .1) { x.save(); x.globalAlpha = (1 - a / .1) * .8; fill('#fff'); x.restore(); }
  byline(true);
}
function grain(t) {
  const r = rng(Math.floor(t * 30) + 11); x.save(); x.globalAlpha = .045;
  for (let i = 0; i < 1600; i++) { x.fillStyle = r() > .5 ? '#fff' : '#000'; x.fillRect(r() * W, r() * H, 2, 2); }
  x.restore();
}

window.render = (t) => {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  if (t >= T_END) { endCard(t); grain(t); return true; }
  const s = state(t), area = SEQ[s.i][2], [, light, dark] = AREA[area];
  // the background floods to the new area's light tone from the landing point
  const prev = s.k > 0 ? AREA[SEQ[s.i - 1][2]][1] : light;
  fill(prev);
  if (s.tau === null || s.k === 0) fill(light);
  else { const r = ease(s.since / .35) * 2300; x.save(); x.fillStyle = light; x.beginPath(); x.arc(W / 2, FLOOR, r, 0, Math.PI * 2); x.fill(); x.restore(); }
  title(t, s);
  const lift = s.tau === null ? lerp(1500, 0, s.fall * s.fall) : 4 * LIFT * s.tau * (1 - s.tau);
  shadow(lift, dark);
  burst(t, s, AREA[area][0]);
  vialAt(t, s);
  byline(false);
  grain(t);
  return true;
};
</script>
