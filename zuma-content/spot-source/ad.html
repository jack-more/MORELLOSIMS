<!doctype html><meta charset="utf-8">
<!-- ZUMA spot, early-2000s TV: colour fields cut on the beat, spinning vials, slammed type, colour fusion, star wipe, chrome logo.
     render(t) is deterministic; shoot.cjs steps t frame by frame and saves PNGs. 120 BPM, 20 s, 1920x1080. -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, BEAT = 0.5;
const c = document.getElementById('c'), x = c.getContext('2d');
const AREA = { metabolic: ['#1F4FD8', '#A3CEFF'], tissue: ['#0E9A5B', '#ABE9C3'], dermal: ['#FF5A1F', '#FFB7C5'], endocrine: ['#D08000', '#FFE97A'], neuro: ['#6E3FD8', '#D9C8FF'], supplies: ['#4E6077', '#D9E1EA'] };
const NO_AREA = { '01': 'metabolic', '02': 'metabolic', '06': 'metabolic', '08': 'metabolic', '09': 'tissue', '05': 'dermal', '10': 'dermal', '04': 'endocrine', '07': 'endocrine', '11': 'neuro', '12': 'neuro', '03': 'supplies' };
const NAME = { '01': 'RT-3', '05': 'GHK-Cu', '09': 'BPC+TB', '04': 'TESAMORELIN', '11': 'SELANK' };
const GRID = ['01', '02', '06', '08', '09', '05', '10', '04', '07', '11', '12', '03'];
const SPIN = {}, HERO = {}; let LOCK, MARK, WORD, FLOWER, LW, MW, WW, WH;
const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });

async function load() {
  await Promise.all([new FontFace('Outfit', 'url(../pack/fonts/Outfit.woff2)', { weight: '100 900' }), new FontFace('Plex', 'url(../pack/fonts/IBMPlexMono-600.woff2)', { weight: '600' }), new FontFace('Figtree', 'url(../pack/fonts/Figtree.woff2)', { weight: '300 900' })]
    .map(async f => document.fonts.add(await f.load())));
  for (const n of ['01', '04', '05', '09', '11']) SPIN[n] = await Promise.all(Array.from({ length: 24 }, (_, k) => img(`../site3/src/img/hspin/${n}-${String(k).padStart(2, '0')}.webp`)));
  for (const n of GRID) HERO[n] = await img(`../site3/src/img/hero-vial-${n}.webp`);
  const F = await (await fetch('final.json')).json(), Wd = await (await fetch('wordmark.json')).json();
  const FO = await (await fetch('flower_outer.json')).json(); FLOWER = new Path2D(FO.outer);
  LOCK = new Path2D(F.lock); MARK = new Path2D(F.mark); WORD = new Path2D(Wd.solid); LW = F.W; MW = F.mw; WW = Wd.w; WH = Wd.h;
  window.READY = true;
}
load();

// ---------- helpers
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const spin = (n, t, fps = 16) => SPIN[n][Math.floor(t * fps) % 24];
function fill(col) { x.fillStyle = col; x.fillRect(0, 0, W, H); }
function vial(im, cx, cy, h, a = 1, shadow = true) {
  if (!im) return; const w = h * im.width / im.height;
  if (shadow) { x.save(); x.globalAlpha = .25 * a; x.fillStyle = '#000'; x.beginPath(); x.ellipse(cx, cy + h * .47, w * .32, h * .035, 0, 0, Math.PI * 2); x.fill(); x.restore(); }
  x.save(); x.globalAlpha = a; x.drawImage(im, cx - w / 2, cy - h / 2, w, h); x.restore();
}
// slammed type: zooms from big to size with trails, RGB split, a 2000s italic skew
function slam(text, cx, cy, size, t0, t, opt = {}) {
  const k = t - t0; if (k < 0) return;
  const p = clamp(k / .14), s = lerp(opt.from || 2.6, 1, ease(p));
  const shake = opt.shake && k < .3 ? (rng(Math.floor(t * 60))() - .5) * 18 * (1 - k / .3) : 0;
  x.save(); x.translate(cx + shake, cy); x.transform(1, 0, -.16, 1, 0, 0);
  x.font = `900 ${size}px Outfit`; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (p < 1) for (let i = 4; i > 0; i--) { x.save(); x.globalAlpha = .12 * (1 - p); const ss = s * (1 + i * .08); x.scale(ss, ss); x.fillStyle = opt.col || '#fff'; x.fillText(text, 0, 0); x.restore(); }
  x.scale(s, s);
  const off = (opt.split ?? 6) * (1 + (1 - p) * 3);
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = '#FF2A6D'; x.globalAlpha = .85; x.fillText(text, -off, 0);
  x.fillStyle = '#19D3FF'; x.fillText(text, off, 0);
  x.globalAlpha = 1; x.fillStyle = opt.col || '#fff'; x.fillText(text, 0, 0);
  x.restore();
}
function outlineText(text, cx, cy, size, col, alpha) {
  x.save(); x.globalAlpha = alpha; x.font = `900 ${size}px Outfit`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.transform(1, 0, -.16, 1, 0, 0); x.lineWidth = 6; x.strokeStyle = col; x.strokeText(text, cx + cy * .16, cy); x.restore();
}
function flare(px, py, a) {
  if (a <= 0) return;
  x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = a;
  let g = x.createRadialGradient(px, py, 0, px, py, 260); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.15, 'rgba(255,240,220,.5)'); g.addColorStop(1, 'rgba(255,200,150,0)');
  x.fillStyle = g; x.fillRect(px - 260, py - 260, 520, 520);
  g = x.createLinearGradient(px - 900, py, px + 900, py); g.addColorStop(0, 'rgba(120,200,255,0)'); g.addColorStop(.5, 'rgba(200,235,255,.7)'); g.addColorStop(1, 'rgba(120,200,255,0)');
  x.fillStyle = g; x.fillRect(px - 900, py - 3, 1800, 6);
  const cx = W / 2, cy = H / 2;
  [[.4, 60, '#7FD3FF'], [.7, 30, '#FFB7C5'], [1.3, 90, '#ABE9C3'], [1.7, 40, '#FFE97A']].forEach(([k, r, col]) => {
    const gx = lerp(px, cx, k), gy = lerp(py, cy, k); x.globalAlpha = a * .25; x.fillStyle = col; x.beginPath();
    for (let i = 0; i < 6; i++) { const an = i * Math.PI / 3; x.lineTo(gx + r * Math.cos(an), gy + r * Math.sin(an)); } x.fill(); });
  x.restore();
}
function star(cx, cy, r) { x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; x.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); } x.closePath(); }
// the byline, bottom left on every shot after the power-on (SKO-style): logo, site, the two disclaimer lines
function byline(t) {
  if (t < 1) return;
  const light = t >= 11.75 && t < 17.3, col = light ? '#111319' : '#FFFFFF';
  x.save(); x.shadowColor = light ? 'rgba(0,0,0,0)' : 'rgba(0,0,0,.55)'; x.shadowBlur = 8; x.fillStyle = col;
  x.save(); x.translate(64, H - 196); const k = 46 / 100; x.scale(k, k); x.fill(LOCK, 'evenodd'); x.restore();
  x.font = '700 30px Figtree'; x.fillText('zumatides.com', 64, H - 104);
  x.font = '600 17px Figtree'; x.globalAlpha = .92;
  x.fillText('FOR LABORATORY RESEARCH USE ONLY. NOT FOR HUMAN OR VETERINARY USE.', 64, H - 74);
  x.fillText('NOT INTENDED TO DIAGNOSE, TREAT, CURE, OR PREVENT ANY DISEASE.', 64, H - 50);
  x.restore();
}
function bug(a, t) { if (a <= 0) return; x.save(); x.globalAlpha = .6 * a; flower(MARK, W - 250, H - 78, 64, t * .8, '#fff'); x.translate(W - 205, H - 96); const k = 140 / WW; x.scale(k, k); x.fillStyle = '#fff'; x.fill(WORD, 'evenodd'); x.restore(); }
function overlays(t) {
  x.save(); x.globalAlpha = .07; x.fillStyle = '#000'; for (let y = 0; y < H; y += 4) x.fillRect(0, y, W, 2); x.restore();
  const g = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  const r = rng(Math.floor(t * 30) + 7); x.save(); x.globalAlpha = .05; for (let i = 0; i < 1400; i++) { x.fillStyle = r() > .5 ? '#fff' : '#000'; x.fillRect(r() * W, r() * H, 2, 2); } x.restore();
}

// ---------- metaballs for the colour fusion (low-res field, scaled up)
const mb = document.createElement('canvas'); mb.width = 240; mb.height = 135; const mx = mb.getContext('2d'); const mi = mx.createImageData(240, 135);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function fusion(t) {
  const cols = ['#1F4FD8', '#FF5A1F', '#0E9A5B', '#6E3FD8', '#D08000'].map(hex);
  const balls = cols.map((col, i) => { const a = t * (.5 + i * .13) + i * 1.3; return { x: 120 + Math.cos(a) * (70 + i * 12), y: 67 + Math.sin(a * 1.3) * (44 - i * 4), r: 40 + 8 * Math.sin(t * 1.7 + i), col }; });
  const d = mi.data;
  for (let y = 0; y < 135; y++) for (let xx = 0; xx < 240; xx++) {
    let f = 0, r = 0, g = 0, b = 0;
    for (const B of balls) { const dx = xx - B.x, dy = y - B.y, v = B.r * B.r / (dx * dx + dy * dy + 1); f += v; r += B.col[0] * v; g += B.col[1] * v; b += B.col[2] * v; }
    const o = (y * 240 + xx) * 4, k = clamp((f - 1) * 8), hi = clamp((f - 2.2) * .5) * 70;
    d[o] = clamp(lerp(18, r / f, k) + hi * k, 0, 255); d[o + 1] = clamp(lerp(12, g / f, k) + hi * k, 0, 255); d[o + 2] = clamp(lerp(42, b / f, k) + hi * k, 0, 255); d[o + 3] = 255;
  }
  mx.putImageData(mi, 0, 0); x.save(); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.filter = 'blur(2px) saturate(1.45) contrast(1.1)'; x.drawImage(mb, -20, -20, W + 40, H + 40); x.restore();
}

// black silhouettes of the spin frames (the iPod-ad dancers, played by vials), cached per frame image
const SIL = new Map();
function sil(im) { if (!im) return null; if (SIL.has(im)) return SIL.get(im); const o = document.createElement('canvas'); o.width = im.width; o.height = im.height;
  const g = o.getContext('2d'); g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0A0A0C'; g.fillRect(0, 0, o.width, o.height); SIL.set(im, o); return o; }
function dancer(n, t, cx, cy, h, phase, beatPh) {
  const im = sil(spin(n, t + phase, 18)); if (!im) return;
  const sway = Math.sin((t / BEAT + phase) * Math.PI) * .22, squash = 1 - .12 * Math.max(0, 1 - beatPh * 3), hop = -Math.abs(Math.sin((beatPh + phase) * Math.PI)) * 70;
  const w = h * im.width / im.height;
  x.save(); x.translate(cx, cy + h / 2 + hop); x.rotate(sway); x.scale(1 / squash * .98, squash); x.drawImage(im, -w / 2, -h, w, h); x.restore();
}

// ---------- the flower
const FCX = 52.13, FCY = 54.81;
function flower(path, cx, cy, h, rot, style, rule = 'evenodd', lineW = 0) {
  x.save(); x.translate(cx, cy); x.rotate(rot); const k = h / 100; x.scale(k, k); x.translate(-FCX, -FCY);
  if (lineW) { x.lineWidth = lineW / k; x.lineJoin = 'round'; x.strokeStyle = style; x.stroke(path); }
  else { x.fillStyle = style; x.fill(path, rule); }
  x.restore();
}
const snap = t => { const b = Math.floor(t / BEAT), p = clamp(((t % BEAT) / BEAT) / .35); return (b + back(p)) * Math.PI * 2 / 5; };   // one petal per beat

// ---------- scenes
function sceneCRT(t) {
  fill('#000');
  const r = rng(Math.floor(t * 60));
  if (t < .4) { for (let i = 0; i < 9000; i++) { const v = r() * 255 | 0; x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(r() * W, r() * H, 3, 3); } return; }
  const k = ease((t - .4) / .45), hh = Math.max(4, H * k);
  x.save(); x.beginPath(); x.rect(0, H / 2 - hh / 2, W, hh); x.clip(); fill(AREA.metabolic[0]); vial(spin('01', t), W / 2, H / 2, 820); x.restore();
  x.save(); x.globalAlpha = 1 - k; x.fillStyle = '#fff'; x.fillRect(0, H / 2 - hh / 2 - 3, W, 6); x.fillRect(0, H / 2 + hh / 2 - 3, W, 6); x.restore();
}
function sceneCuts(t) {   // 1.0 to 5.0: a colour and a vial per beat
  const seq = ['01', '05', '09', '04', '11', '09', '05', '01'];
  const i = clamp(Math.floor((t - 1) / BEAT), 0, 7), ph = ((t - 1) % BEAT) / BEAT, n = seq[i], [br, lt] = AREA[NO_AREA[n]];
  fill(br);
  // huge outlined name scrolling behind
  x.save(); x.globalAlpha = .55; flower(MARK, W / 2, H / 2 + 20, 1500, snap(t - 1), lt); x.restore();
  const others = seq.filter(m => m !== n);
  dancer(others[i % others.length], t, 420, H / 2 + 40, 760, .3, ph);
  dancer(others[(i + 2) % others.length], t, W - 420, H / 2 + 40, 760, .8, ph);
  dancer(others[(i + 4) % others.length], t, W / 2 - 700, H / 2 + 120, 520, .55, ph);
  dancer(others[(i + 1) % others.length], t, W / 2 + 700, H / 2 + 120, 520, .1, ph);
  const pop = 1 + .1 * Math.max(0, 1 - ph * 4), bounce = -Math.abs(Math.sin(ph * Math.PI)) * 46;
  vial(spin(n, t, 20), W / 2, H / 2 + 30 + bounce, 860 * pop);
  if (ph < .1) { x.save(); x.globalAlpha = (1 - ph / .1) * .5; fill('#fff'); x.restore(); }
  // corner caption, TV style
  x.save(); x.font = '600 26px Plex'; x.fillStyle = '#fff'; x.globalAlpha = .9; x.fillText(`${NAME[n]} · ${NO_AREA[n].toUpperCase()} RESEARCH`, 70, 80); x.restore();
}
function sceneSlam(t) {   // 5.0 to 8.0: EVERY / LOT / TESTED.
  const i = Math.floor((t - 5) / BEAT), cols = ['#FF5A1F', '#1F4FD8', '#0E9A5B', '#6E3FD8', '#D08000', '#FF5A1F'];
  fill(cols[clamp(i, 0, 5)]);
  if (t < 6) { slam(t < 5.5 ? 'EVERY' : 'LOT', W / 2, H / 2, 380, t < 5.5 ? 5 : 5.5, t, { shake: true }); }
  else {
    slam('TESTED.', W / 2, H / 2 - 40, 330, 6, t, { shake: true, from: 3 });
    if (t > 6.5) { const k = ease((t - 6.5) / .3); x.save(); x.globalAlpha = k; x.font = '600 40px Plex'; x.textAlign = 'center'; x.fillStyle = '#fff'; x.fillText('HPLC  ·  MASS SPEC  ·  EVERY SINGLE LOT', W / 2, H / 2 + 160); x.restore(); }
    const k = ease((t - 6.2) / .5);
    vial(spin('05', t), lerp(-200, 260, k), H / 2 + 60, 620, 1); vial(spin('09', t + .7), lerp(W + 200, W - 260, k), H / 2 + 60, 620, 1);
  }
}
function sceneFusion(t) {  // 8.0 to 12.0: hard-edged rings of the six area colours zoom out of the vial; split wipes swap the compound
  const order = ['01', '09', '05', '04', '11', '01'], pal = ['#1F4FD8', '#0E9A5B', '#FF5A1F', '#D08000', '#6E3FD8', '#4E6077'];
  const seg = (t - 8) / .8, i = clamp(Math.floor(seg), 0, 4), ph = seg - Math.floor(seg);
  const rot = pal.slice(i).concat(pal.slice(0, i));
  // rings: largest first, each a solid colour, zooming outward, a little faster on the beat
  const beatPh = ((t - 8) % BEAT) / BEAT, push = (1 - beatPh) * 26;
  const step = 150, maxR = Math.hypot(W, H) / 2 + step, base = ((t - 8) * 260) % step;
  const n = Math.ceil(maxR / step) + 1;
  for (let k = n + 2; k >= 0; k--) {
    const r = base + k * step + push * (k / n); if (r <= 0) continue;
    flower(FLOWER, W / 2, H / 2 + 20, r * 2.15, (k % 2 ? 1 : -1) * (t - 8) * .35 + k * .12, rot[k % 6], 'nonzero');
  }
  // the split wipe at each swap: the next pair of colours slides in from both sides
  if (ph > .78 && i < 4) {
    const k = ease((ph - .78) / .22), w = W / 2 * k;
    x.fillStyle = rot[1]; x.fillRect(0, 0, w, H); x.fillStyle = rot[2]; x.fillRect(W - w, 0, w, H);
  }
  // white disc behind the vial, like a spotlight, pulsing on the beat
  x.save(); x.globalAlpha = .92; flower(FLOWER, W / 2, H / 2 + 20, 560 + (1 - beatPh) * 50, snap(t - 8) * .2, '#fff', 'nonzero'); x.restore();
  const n0 = order[i];
  vial(spin(n0, t, 18), W / 2, H / 2 + 30 - Math.abs(Math.sin(beatPh * Math.PI)) * 30, 820);
  if (ph < .08 && t > 8.1) { x.save(); x.globalAlpha = (1 - ph / .08) * .7; fill('#fff'); x.restore(); }
  flare(lerp(-200, W + 200, clamp((t - 9.2) / 1.2)), 260, t > 9.2 && t < 10.4 ? .9 : 0);
  const o = { split: 5, col: '#fff' };
  if (t > 8.3 && t < 10.1) slam('SIX AREAS.', W / 2, 150, 150, 8.35, t, o);
  if (t > 10.1) slam('ONE COLOR EACH.', W / 2, 150, 140, 10.15, t, o);
}
function sceneGrid(t) {    // 11.6 to 17.5: twelve vials pop in on the eighth notes, then hold and bounce in a wave with their names
  fill('#F4F2EC');
  const cw = 236, ch = 262, gx = (W - cw * 6 - 22 * 5) / 2, gy = 236;
  GRID.forEach((n, i) => {
    const t0 = 11.62 + i * .25, k = back((t - t0) / .3); if (t < t0) return;
    const c = i % 6, r = Math.floor(i / 6), X = gx + c * (cw + 22), Y = gy + r * (ch + 62);
    const wave = t > 14.8 ? -Math.max(0, Math.sin((t - 14.8) * Math.PI * 2 - i * .55)) * 22 : 0;
    x.save(); x.translate(X + cw / 2, Y + ch / 2 + wave); x.scale(k, k);
    x.fillStyle = AREA[NO_AREA[n]][0]; x.beginPath(); x.roundRect(-cw / 2, -ch / 2, cw, ch, 26); x.fill();
    x.restore(); vial(HERO[n], X + cw / 2, Y + ch / 2 + 8 + wave, ch * 1.05 * k, 1, false);
    if (t > 14.9) { const a = ease((t - 14.9 - i * .05) / .3); x.save(); x.globalAlpha = a; x.font = '800 26px Outfit'; x.textAlign = 'center'; x.fillStyle = '#111319';
      x.fillText(LABEL[n], X + cw / 2, Y + ch + 40); x.restore(); }
  });
  slam('TWELVE COMPOUNDS.', W / 2, 160, 130, 14.95, t, { col: '#111319', split: 3 });
}
const LABEL = { '01': 'RT-3', '02': 'TZ-2', '06': 'MOTS-c', '08': 'NAD+', '09': 'BPC+TB', '05': 'GHK-Cu', '10': 'GHK+BT', '04': 'TESAMORELIN', '07': 'CJC+IPA', '11': 'SELANK', '12': 'SEMAX', '03': 'BAC WATER' };
function sceneBloom(t) {   // 17.5 to 18.7: the flower alone, blooming in and turning a petal per beat over the colour rays
  rays(t);
  const k = back((t - 17.55) / .45), pal = ['#1F4FD8', '#0E9A5B', '#FF5A1F', '#D08000', '#6E3FD8'];
  const spinTo = ease((t - 17.5) / 1.1) * Math.PI * 2;
  for (let i = 4; i >= 0; i--) { const kk = back((t - 17.55 - i * .06) / .45); if (kk > 0) flower(FLOWER, W / 2, H / 2, (520 + i * 70) * kk, spinTo * (1 + i * .12), pal[i], 'nonzero'); }
  if (k > 0) { flower(FLOWER, W / 2, H / 2, 470 * k, spinTo, '#0E1014', 'nonzero'); flower(MARK, W / 2, H / 2, 470 * k, spinTo, '#F7F4EE'); }
}
function rays(t) {
  fill('#0E1014');
  x.save(); x.translate(W / 2, H / 2 - 40); x.rotate(t * .25);
  ['#1F4FD8', '#0E9A5B', '#FF5A1F', '#D08000', '#6E3FD8', '#4E6077'].forEach((col, i) => { for (let j = 0; j < 2; j++) { const a = (i * 2 + j) * Math.PI / 6; x.fillStyle = col; x.globalAlpha = .28; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, 1400, a, a + Math.PI / 12); x.fill(); } });
  x.restore();
}
function sceneEnd(t) {     // 15.5 to 20.0
  fill('#0E1014');
  x.save(); x.translate(W / 2, H / 2 - 40); x.rotate(t * .25);
  ['#1F4FD8', '#0E9A5B', '#FF5A1F', '#D08000', '#6E3FD8', '#4E6077'].forEach((col, i) => { for (let j = 0; j < 2; j++) { const a = (i * 2 + j) * Math.PI / 6; x.fillStyle = col; x.globalAlpha = .28; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, 1400, a, a + Math.PI / 12); x.fill(); } });
  x.restore();
  const k = back((t - 15.7) / .45);
  if (t > 15.7) {
    const lw = 980 * k, s = lw / LW;
    const ox = W / 2 - lw / 2, oy = H / 2 - 120 - 50 * s;
    const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    o.save(); o.translate(ox, oy); o.scale(s, s); o.fillStyle = '#F7F4EE'; o.fill(LOCK, 'evenodd'); o.restore();
    const sx = lerp(-400, W + 400, clamp((t - 16.6) / .8));     // chrome shine sweep
    o.globalCompositeOperation = 'source-atop'; const g = o.createLinearGradient(sx - 180, 0, sx + 180, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.45, 'rgba(160,220,255,.9)'); g.addColorStop(.5, 'rgba(255,255,255,1)'); g.addColorStop(.55, 'rgba(255,190,220,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    o.fillStyle = g; o.fillRect(0, 0, W, H);
    x.save(); x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 40; x.shadowOffsetY = 14; x.drawImage(off, 0, 0); x.restore();
  }
  if (t > 17.0) { const a = ease((t - 17) / .4); x.save(); x.globalAlpha = a; x.font = '800 74px Outfit'; x.textAlign = 'center'; x.fillStyle = '#F7F4EE'; x.fillText('Every lot tested.', W / 2, H / 2 + 150); x.restore(); }
  if (t > 17.6) {
    const a = back((t - 17.6) / .35), w = 560 * a, h = 92 * a, cx = W / 2, cy = H / 2 + 270;
    x.save(); x.fillStyle = '#9C978B'; x.beginPath(); x.roundRect(cx - w / 2, cy - h / 2 + 10, w, h, h / 2); x.fill();
    x.fillStyle = '#F7F4EE'; x.beginPath(); x.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); x.fill();
    x.font = `800 ${40 * a}px Outfit`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#111319'; x.fillText('zumatides.com/enter', cx, cy + 2); x.restore();
  }
}

window.render = t => {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  if (t < 1) sceneCRT(t);
  else if (t < 5) sceneCuts(t);
  else if (t < 8) sceneSlam(t);
  else if (t < 12) {
    sceneFusion(t);
    if (t > 11.55) { const r = ease((t - 11.55) / .45) * 1500; x.save(); x.translate(W / 2, H / 2); x.rotate((t - 11.55) * 2.4); x.scale(r / 50, r / 50); x.translate(-FCX, -FCY); x.clip(FLOWER); x.setTransform(1, 0, 0, 1, 0, 0); sceneGrid(t); x.restore(); }
  }
  else if (t < 17.5) {
    sceneGrid(t);
    if (t > 17.2) { const r = lerp(1600, 0, ease((t - 17.2) / .3)); const o = document.createElement('canvas'); o.width = W; o.height = H; const g = o.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'destination-out'; g.translate(W / 2, H / 2); g.rotate(-(t - 17.2) * 3); g.scale(Math.max(.001, r / 50), Math.max(.001, r / 50)); g.translate(-FCX, -FCY); g.fill(FLOWER); x.drawImage(o, 0, 0); }
  }
  else if (t < 18.7) sceneBloom(t);
  else sceneEnd(t - 3);
  bug(t > 1 && t < 11.6 ? 1 : 0, t);
  byline(t);
  overlays(t);
  return true;
};
